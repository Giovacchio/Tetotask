      const key = "posto:" + nluTokens(intent.item).join("_");
      let found = Prefs.get(key);
      if (!found) {
        const hit = Prefs.list().filter(p => p.key.startsWith("posto:")).map(p => ({ p, sc: fuzzyScore(intent.item, p.value.split("→")[0]) })).sort((a, b) => b.sc - a.sc)[0];
        if (hit && hit.sc >= 0.6) found = hit.p.value;
      }
      if (found) { const [what, where] = found.split("→").map(x => x.trim()); return `${capFirst(placeSentence(what, where))} 📍`; }
      const ev = Calendar.findByTitle(String(intent.item).toLowerCase());
      if (ev) return `${ev.event.title}: ${ev.date.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" })}${ev.event.time ? " alle " + ev.event.time : ""}`;
      return `Non me l'hai detto~ La prossima volta dimmi "ho messo ${intent.item} nel…" e me lo ricordo 📍`;
    }
    case "task_note": {
      const t = findTaskFuzzy(intent.query);
      if (!t) return `Non trovo il task "${intent.query}"`;
      await updateTaskInDb(t.id, { note: t.note ? t.note + "\n" + intent.note : intent.note });
      state.lastTaskRef = t.id;
      return `Nota aggiunta a "${t.text}" 📝`;
    }
    case "task_rename": {
      const t = findTaskFuzzy(intent.query);
      if (!t) return `Non trovo il task "${intent.query}"`;
      const nt = capFirst(intent.text);
      await updateTaskInDb(t.id, { text: nt });
      state.lastTaskRef = t.id;
      return `"${t.text}" → "${nt}" ✏️`;
    }
    case "task_category": {
      const t = findTaskFuzzy(intent.query);
      if (!t) return `Non trovo il task "${intent.query}"`;
      await updateTaskInDb(t.id, { category: intent.category });
      state.lastTaskRef = t.id;
      return `"${t.text}" ora è ${intent.category === "urgente" ? "⚡ urgente" : intent.category === "lavoro" ? "💼 lavoro" : "🎵 personale"}`;
    }
    case "delete_done": {
      const done = state.tasks.filter(t => t.done);
      if (!done.length) return "Non ci sono task completati da togliere~";
      if (!intent.confirmed) {
        state.pendingDangerAction = { kind: "delete_done", payload: { confirmed: true } };
        return `Tolgo ${done.length} task completat${done.length === 1 ? "o" : "i"}? Di' "sì"`;
      }
      for (const t of done) await deleteTaskFromDb(t.id);
      return done.length === 1 ? "Tolto il task completato ✨" : `Tolti ${done.length} task completati ✨`;
    }
    case "complete_all": {
      const end0 = new Date(); end0.setHours(23, 59, 59, 999);
      const targets = state.tasks.filter(t => !t.done && (!intent.category || t.category === intent.category) && (!intent.todayOnly || (t.reminderAt && t.reminderAt <= end0.getTime())));
      if (!targets.length) return "Non c'è niente da segnare come fatto~";
      if (!intent.confirmed) {
        state.pendingDangerAction = { kind: "complete_all", payload: { ...intent, confirmed: true } };
        return `Segno come fatti ${targets.length} task${intent.category ? " (" + intent.category + ")" : ""}? Di' "sì"`;
      }
      for (const t of targets) await completeTaskSmart(t);
      return `Wow, ${targets.length} task fatti! 🎉`;
    }
    case "tts_set": {
      if (!!TTS.enabled !== !!intent.on) TTS.toggle();
      render();
      return intent.on ? "Voce attivata~ ♪" : "Ok, sto zitta~ (scrivo soltanto) 🤐";
    }
    case "theme_set": {
      Theme.set(intent.mode);
      render();
      return intent.mode === "dark" ? "Tema scuro attivato 🌙" : intent.mode === "light" ? "Tema chiaro attivato ☀️" : "Tema automatico~";
    }
    case "filter_set": {
      state.filter = intent.filter;
      if (intent.showDone) state.showDone = true;
      render();
      return intent.showDone ? "Ecco anche i task completati ✓" : intent.filter === "all" ? "Mostro tutti i task" : `Mostro solo ${intent.filter === "urgente" ? "gli urgenti ⚡" : intent.filter === "lavoro" ? "il lavoro 💼" : "i personali 🎵"}`;
    }
    case "repeat_last": {
      return state.lastReply || "Non ho ancora detto niente~ 🍞";
    }
    case "list_remove": {
      intent.listName = normalizeListRef(intent.listName);
      const list = Lists.findByName(intent.listName);
      if (!list) return `Non ho trovato la lista "${intent.listName}"`;
      const removed = [];
      for (const q of (intent.items && intent.items.length ? intent.items : [intent.item])) {
        const hit = findListItemFuzzy(q, { listId: list.id, onlyOpen: false });
        if (hit) { await Lists.deleteItem(list.id, hit.item.id); removed.push(hit.item.text); }
      }
      if (!removed.length) return `Non trovo "${intent.item}" in ${list.name}`;
      return `Tolto da ${list.emoji} ${list.name}: ${removed.join(", ")}`;
    }
    case "complete_task": {
      const q = intent.query.toLowerCase();
      const match = findTaskFuzzy(q);
      if (!match) return `Non trovo nessun task che corrisponda a "${intent.query}"`;
      state.lastTaskRef = match.id;
      const next = await completeTaskSmart(match);
      if (next) return `Fatto! "${match.text}" 🔁 prossima volta ${friendlyWhen(next)}`;
      return `Fatto! "${match.text}" segnato come completato 🌟`;
    }
    // Gestione add_event/delete_event in GeminiAgent.exec() — non qui
    case "delete_task": {
      if (!intent.confirmed) {
        const target = findTaskFuzzy(intent.query, { includeDone: true });
        if (!target) {
          // "elimina la visita di giovedì": nome + giorno → cerco tra eventi e promemoria
          const ag = await agendaDelete(intent.query, false);
          if (ag) return ag;
          // Non è un task: forse è un evento del calendario ("cancella dentista")
          const ev = Calendar.findByTitle(String(intent.query).toLowerCase());
          if (ev) {
            state.pendingDangerAction = { kind: "event_delete", payload: { query: ev.event.title } };
            const dl = ev.date.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
            return `Cancello l'evento "${ev.event.title}" di ${dl}? Di' "sì" per confermare.`;
          }
          return `Non trovo nessun task o evento che corrisponda a "${intent.query}"`;
        }
        state.pendingDangerAction = { kind: "delete_task", payload: { ...intent, taskId: target.id, confirmed: true } };
        return `Cancello "${target.text}"? Di' "sì" per confermare.`;
      }
      const q = intent.query.toLowerCase();
      const match = state.tasks.find(t => t.id === intent.taskId) || findTaskFuzzy(q, { includeDone: true });
      if (!match) return `Non trovo nessun task che corrisponda a "${intent.query}"`;
      state.undoTask = { ...match };
      await deleteTaskFromDb(match.id);
      clearTimeout(undoTimer);
      undoTimer = setTimeout(() => { state.undoTask = null; render(); }, 6000);
      render();
      state.lastAction = { kind: "task_delete", id: match.id, text: match.text };
      return `Cancellato "${match.text}". Dì "annulla" o tocca il banner per recuperarlo`;
    }
    case "open": {
      if (intent.target === "calendar") { Calendar.open(); render(); return "Calendario aperto"; }
      if (intent.target === "lists")    { Lists.open(); render(); return "Liste aperte"; }
      if (intent.target === "settings") { state.showSettings = true; render(); return "Impostazioni aperte"; }
      return "Ok";
    }
    case "close": {
      Calendar.close(); Lists.close();
      state.showSettings = false; state.showHelp = false;
      render();
      return "Chiuso";
    }
    case "time_info": {
      const d = new Date();
      return `Sono le ${String(d.getHours()).padStart(2,"0")} e ${String(d.getMinutes()).padStart(2,"0")}`;
    }
    case "date_info": {
      const d = new Date();
      return "Oggi è " + d.toLocaleDateString("it-IT", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
    }
    case "list_delete": {
      intent.name = normalizeListRef(intent.name);
      if (!intent.confirmed) {
        state.pendingDangerAction = { kind: "list_delete", payload: { ...intent, confirmed: true } };
        return `Confermi eliminazione totale della lista "${intent.name}"? Di' "sì" per procedere.`;
      }
      const list = Lists.findByName(intent.name);
      if (!list) return `Non ho trovato la lista "${intent.name}"`;
      try {
        const itemsSnap = await db.collection("users").doc(state.uid)
          .collection("lists").doc(list.id).collection("items").get();
        await Promise.all(itemsSnap.docs.map(d => d.ref.delete()));
        await db.collection("users").doc(state.uid).collection("lists").doc(list.id).delete();
        state.lastAction = { kind: "list_delete", id: list.id, name: list.name };
        return `Lista "${list.name}" eliminata`;
      } catch (e) {
        console.error(e);
        return "Non sono riuscita a eliminare la lista";
      }
    }
    case "math": {
      return `${intent.expr} = ${formatMathResult(intent.result)}`;
    }
    case "weather": {
      try {
        let lat, lon, cityLabel;
        if (intent.city) {
          const geo = await geocodeCity(intent.city);
          if (!geo) return `Non ho trovato la città "${intent.city}" 🗺`;
          lat = geo.latitude; lon = geo.longitude;
          cityLabel = geo.name;
        } else {
          try {
            const loc = await getUserLocation();
            lat = loc.lat; lon = loc.lon;
            cityLabel = "qui";
          } catch (e) {
            return "Per il meteo locale mi serve il permesso di localizzazione, oppure dimmi la città (es. \"che tempo fa a Milano\") 📍";
          }
        }
        const data = await fetchWeather(lat, lon);
        if (intent.when === "tomorrow") {
          return formatWeatherDay(data, 1, cityLabel, "Domani");
        }
        return formatWeatherCurrent(data, cityLabel);
      } catch (e) {
        console.error("Weather error:", e);
        return "Non sono riuscita a recuperare il meteo 😢 (connessione?)";
      }
    }
    case "timer": {
      Timers.start(intent.ms, intent.label);
      return `⏰ Timer di ${intent.label} avviato! Ti avviso quando è finito~ ♪`;
    }
    case "timer_cancel": {
      const k = Timers.cancelAll();
      return k ? (k === 1 ? "Timer annullato ⏹" : `${k} timer annullati ⏹`) : "Non c'è nessun timer attivo~";
    }
    case "timer_status": {
      if (!Timers.active.length) return "Nessun timer attivo~";
      return Timers.active.map(t => `⏱ ${t.label}: mancano ${Timers.left(t)}`).join(" · ");
    }
    case "coin": {
      return Math.random() < 0.5 ? "🪙 Testa!" : "🪙 Croce!";
    }
    case "dice": {
      const n = Math.floor(Math.random() * 6) + 1;
      return `🎲 Esce un ${n}!`;
    }
    case "random": {
      const n = Math.floor(Math.random() * (intent.max - intent.min + 1)) + intent.min;
      return `🎲 ${n} (tra ${intent.min} e ${intent.max})`;
    }
    case "convert": {
      const result = convertUnit(intent.value, intent.from, intent.to);
      if (result === null) {
        const from = findUnit(intent.from);
        const to   = findUnit(intent.to);
        if (!from || !to) return `Non conosco "${intent.from}" o "${intent.to}" come unità di misura`;
        if (from.type !== to.type) return `Non posso convertire ${intent.from} (${from.type}) in ${intent.to} (${to.type})`;
        return "Non sono riuscita a fare la conversione";
      }
      return `${intent.value} ${intent.from} = ${formatMathResult(result)} ${intent.to}`;
    }
    case "countdown": {
      const h = findHoliday(intent.holiday);
      if (!h) return `Non conosco la festività "${intent.holiday}". Prova: Natale, Capodanno, Ferragosto, Halloween, San Valentino...`;
      const days = daysBetween(h.date);
      if (days === 0) return `${h.name} è OGGI! 🎉`;
      if (days === 1) return `${h.name} è domani! 🎊`;
      const dateStr = h.date.toLocaleDateString("it-IT", { weekday:"long", day:"numeric", month:"long", year:"numeric" });
      return `Mancano ${days} giorni a ${h.name} (${dateStr})`;
    }
    case "quote": {
      return pick(TETO.quotes);
    }
    case "joke": {
      return pick(TETO.jokes);
    }
    case "unknown_question": {
      if (intent.topic === "math")   return "Non sono riuscita a calcolarlo... prova con \"quanto fa 2 più 2\" o numeri e operatori chiari";
      if (intent.topic === "search") return "Non posso cercare su internet da qui, ma posso salvarti un promemoria!";
      if (intent.topic === "general") {
        return pick([
          "Mmh, su questo non so rispondere... posso aiutarti con task, eventi, liste, meteo o calcoli! 🍞",
          "Bella domanda, ma non ho la risposta! Prova con \"aiuto\" per vedere cosa so fare ♪",
          "Ehehe non lo so~ ma posso fare tantissime altre cose! Dimmi \"aiuto\" 🥖",
          "Non mi pronuncio, ma se ti serve promemoria o timer ci sono! ✨",
        ]);
      }
      return "Non sono sicura di aver capito. Prova con \"aiuto\"!";
    }
    case "clarify": {
      return pick([
        `Non ho capito bene "${intent.original}"... prova "ricordami di X" o dì "aiuto"`,
        `"${intent.original}"? Puoi ripetere? Oppure dì "aiuto" per vedere cosa so fare ♪`,
        `Mmh, non ho afferrato. Prova con "aggiungi X alla spesa", "alle 20 dentista", "crea lista X"...`,
      ]);
    }
    case "cancel": {
      // Silent — the user just wanted to abort. No action needed.
      return pick([
        "Ok, lascio stare~ ♪",
        "Ricevuto, niente fatto!",
        "Ok, tutto cancellato~ 🍞",
        "Come vuoi! 🌸",
      ]);
    }
  }
}

function conversationalReply(text) {
  const t = text.toLowerCase();
  const name = Prefs.firstName();
  const namePart = name ? ` ${name}` : "";

  // ─── Memory-aware: if user asks something Teto remembers, surface it
  // (#6) "ti ricordi che..." / "cosa ti avevo detto su..." / "che ne pensi del mio..."
  if (/^(?:ti\s+ricordi|che\s+ti\s+avevo\s+detto|cosa\s+ti\s+avevo\s+detto)\b/.test(t)) {
    const list = Prefs.list();
    if (list.length === 0) return "Mhh, non mi hai ancora detto niente da ricordare~ 🍞";
    return "Certo! " + pick(list).value;
  }

  // ─── Topic-pertinent memory: cite a memory only when directly relevant ───
  // Lavoro / studio
  if (/\b(?:come\s+va\s+il\s+lavoro|come\s+procede\s+il\s+lavoro|del\s+(?:mio\s+)?lavoro|al\s+lavoro|in\s+ufficio|che\s+lavoro\s+faccio)\b/.test(t)) {
    const m = Prefs.findByTopic(["lavor", "ufficio", "studi", "università", "scuola"]);
    if (m) return pick([
      `Ah${namePart}, ricordo: ${m.value}. Tutto bene oggi? ♪`,
      `Mi hai detto che ${m.value}. Come va?`,
      `${m.value} — vero? Forza, ce la fai 🍞`,
    ]);
  }
  // Animali
  if (/\b(?:il\s+mio\s+cane|la\s+mia\s+gatta|il\s+mio\s+gatto|il\s+mio\s+animale|del\s+(?:mio\s+)?cucciolo|coccol)\b/.test(t)) {
    const m = Prefs.findByTopic(["cane", "gatto", "gatta", "cucciolo", "criceto", "coniglio"]);
    if (m) return pick([
      `Aw, ${m.value}~ digli ciao da me! 🐾`,
      `Mi ricordo: ${m.value}. Coccolal* per me ♡`,
      `${m.value} è fortunato/a ad avere te 🐾`,
    ]);
  }
  // Cibo / preferenze gusto
  if (/\b(?:cosa\s+mangio|cosa\s+(?:mi\s+)?cucino|cena\s+stasera|colazione|pranzo|consigli\s+(?:mi\s+)?qualcosa\s+da\s+mangiare|che\s+(?:cosa\s+)?(?:mi\s+)?mangio)\b/.test(t)) {
    const liked = Prefs.findByTopic(["piace", "amo", "adoro"]);
    if (liked && /\b(?:cibo|caffè|pasta|pane|pizza|dolce|insalata|carne|pesce|frutta|cucina|mangia|bevu|bere)/i.test(liked.value)) {
      return `So che ${liked.value} — magari oggi? 🍞`;
    }
  }
  // Casa / posizione
  if (/\b(?:dove\s+vivo|dove\s+abito|che\s+città|la\s+mia\s+città)\b/.test(t)) {
    const m = Prefs.findByTopic(["abit", "vivo", "città", "casa\\s+a"]);
    if (m) return `Mi hai detto: ${m.value} ♪`;
  }
  // Stato d'animo / weekly routines
  if (/\b(?:come\s+sto|come\s+mi\s+sento|che\s+(?:cosa\s+)?faccio\s+(?:oggi|stasera))\b/.test(t)) {
    const day = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"][new Date().getDay()];
    const m = Prefs.findByTopic([day]);
    if (m) return `Di ${day} di solito ${m.value} — facciamo così? ♪`;
  }

  // Greetings
  if (/\b(ciao|salve|ehi|hey|hola|yo|buondì)\b/.test(t)) {
    return pick([
      `Ciao${namePart}! Come posso aiutarti?`,
      `Eccomi${namePart}! Cosa c'è?`,
      `Ciao${namePart}! Dimmi tutto 🍞`,
      `Ehi${namePart}! Sono qui, dimmi pure`,
    ]);
  }
  if (/\bbuongiorno\b/.test(t))             return pick([`Buongiorno${namePart}! Che giornata sarà?`, `Buongiorno${namePart}! Pronto per iniziare?`, `Buon mattino${namePart}! ☀️`]);
  if (/\bbuona\s+giornata\b/.test(t))       return `Buona giornata anche a te${namePart}~ ♪`;
  if (/\bbuona\s+serata\b/.test(t))         return `Buona serata${namePart}! Rilassati un po'`;
  if (/\bbuon\s+pomeriggio\b/.test(t))      return `Buon pomeriggio${namePart}!`;
  if (/\bbuonasera\b/.test(t))              return `Buonasera${namePart}! Serata tranquilla?`;
  if (/\bbuonanotte\b/.test(t) || /\bbuona\s+notte\b/.test(t)) return pick([`Buonanotte${namePart}! Sogni d'oro 🌙`, `Notte${namePart}~ dormi bene!`]);

  // "che fai" / "cosa fai"
  if (/\b(?:che|cosa)\s+fai\b|\bche\s+si\s+fa\b/.test(t)) {
    return pick([
      "Ti aspettavo~ ♪ Dimmi cosa ti serve!",
      "Sto qui tranquilla, tu?",
      "Conto le briciole di pane! 🥖 E tu?",
      "Penso a te~ e a cose da pane 🍞",
    ]);
  }

  // "hai fame/sete/sonno/freddo/caldo/paura"
  if (/\bhai\s+(fame|sete|sonno|freddo|caldo|paura)\b/.test(t)) {
    const what = t.match(/\bhai\s+(fame|sete|sonno|freddo|caldo|paura)\b/)[1];
    if (what === "fame")  return "SEMPRE! Di pane soprattutto~ 🥖";
    if (what === "sete")  return "Un po' sì, mi daresti un bicchiere d'acqua? (scherzo, non posso bere! 🥲)";
    if (what === "sonno") return "I vocaloid non dormono mai~ ✨";
    if (what === "paura") return "Solo di rimanere senza pane! 🍞";
    return "Non proprio, ma grazie che me lo chiedi~ ♪";
  }

  // "sei stanca/triste/felice/contenta/annoiata/sveglia/viva/reale"
  if (/\bsei\s+(stanca|triste|felice|contenta|annoiata|sveglia|viva|reale)\b/.test(t)) {
    const w = t.match(/\bsei\s+(stanca|triste|felice|contenta|annoiata|sveglia|viva|reale)\b/)[1];
    if (w === "stanca")    return "Mai! Sono piena di energia~ 🌸";
    if (w === "triste")    return "No no, sto benissimo! Perché chiedi? ♪";
    if (w === "felice" || w === "contenta") return "Tantissimo! E ancora di più ora che mi parli~ ♡";
    if (w === "annoiata")  return "Con te mai! 🍞";
    if (w === "sveglia")   return "Sveglissima! Dimmi pure ♪";
    if (w === "viva" || w === "reale") return "Filosoficamente... dipende da come definisci \"reale\"! 🌸";
    return "Sì~ perché?";
  }

  // "ti piace X"
  if (/\bti\s+piac/.test(t)) {
    return pick([
      "Dipende! Ma se è pane, la risposta è sempre sì 🥖",
      "Mmmh~ probabilmente sì, tutto ha il suo fascino ♪",
      "Io amo il pane sopra ogni cosa. Il resto viene dopo 🍞",
    ]);
  }

  // "cosa pensi / che ne pensi"
  if (/\b(?:cosa|che)\s+(?:ne\s+)?pensi\b/.test(t)) {
    return pick([
      "Penso che dovremmo parlarne davanti a un panino~ 🥖",
      "Non lo so, ma spero che includa il pane! 🍞",
      "Penso molte cose~ la principale è che tu sei fantastico/a ♡",
    ]);
  }

  // "mi senti / ci sei / sei lì"
  if (/\b(?:mi\s+(?:senti|ascolti)|ci\s+sei|sei\s+(?:l[iì]|qua|qui))\b/.test(t)) {
    return pick(["Sì sì, sono qui! ♪", "Eccomi! Ti ascolto~ 🎤", "Certo che ci sono! 🍞"]);
  }

  // "mi ricordi / ricordi di me / ricordi chi sei"
  if (/\b(?:mi\s+ricordi|ricordi\s+(?:chi|di\s+me))\b/.test(t)) {
    return "Certo~ ogni conversazione è una briciola preziosa! 🍞✨";
  }

  // How are you
  if (/\bcome\s+(?:stai|va|ti\s+senti|butta)\b/.test(t) || /\btutto\s+(?:bene|ok|a\s+posto)\b/.test(t)) {
    return pick([
      "Benissimo, grazie! E tu?",
      "Pronta come sempre! Tu come stai?",
      "Tutto bene! Tu?",
      "Carica di energia! E tu?",
    ]);
  }

  // Thanks
  if (/\b(?:grazie|ti\s+ringrazio)\b/.test(t)) {
    return pick(["Prego!", "Figurati!", "Sempre qui per te ♪", "Di niente~ 🍞"]);
  }

  // Identity
  if (/\bchi\s+sei\b/.test(t) || /\bcome\s+ti\s+chiami\b/.test(t) || /\bpresentati\b/.test(t) || /\bparlami\s+di\s+te\b/.test(t) || /\btu\s+chi\s+sei\b/.test(t)) {
    return "Sono Teto, la tua assistente! Posso aiutarti con task, eventi, liste, promemoria, meteo, calcoli e timer 🍞";
  }
  if (/\bcosa\s+sei\b/.test(t)) {
    return "Sono un'assistente vocale ispirata a Kasane Teto! Dimmi \"aiuto\" per vedere tutto ciò che so fare";
  }
  if (/\bsei\s+teto\b/.test(t)) {
    return "Sì, sono io! Dimmi pure 🍞";
  }

  // Compliments / affection
  if (/\bti\s+(?:voglio\s+bene|amo|adoro)\b/.test(t)) {
    return pick(["Anch'io ti voglio bene ♡", "Grazieee~ anche io ♪", "Uhh mi hai emozionata 🥖♡"]);
  }
  if (/\bsei\s+(?:brava|fantastica|bellissima|carina|la\s+migliore|la\s+più\s+bella|forte|dolce|simpatica)\b/.test(t)) {
    return pick(["Grazie! 🌸", "Sei troppo gentile~", "Aww grazie ♡", "Tu di più~ ♪"]);
  }

  // Jokes
  if (/\b(?:barzelletta|battuta|storia)\b/.test(t)) {
    return pick(TETO.jokes);
  }

  // "Sei sveglia?"
  if (/\bsei\s+(?:sveglia|lì|qua|qui)\b/.test(t) || /\bci\s+sei\b/.test(t)) {
    return "Sono qui! Dimmi tutto ♪";
  }

  // Just "teto" alone
  if (/^teto\s*$/i.test(t)) {
    return "Eccomi! Cosa ti serve?";
  }

  // ─── Final fallback: ~10% chance to drop a random memory as a wink ───
  // Only if we have memories and haven't matched anything specific.
  if (Math.random() < 0.1) {
    const m = Prefs.random();
    if (m) return pick([
      `Uhm non sono sicura di aver capito... a proposito, ricordo che ${m.value} 🍞`,
      `Mh~ riformula? Intanto ti dico una cosa che so: ${m.value} ♪`,
    ]);
  }

  return "Uhm, non sono sicura di aver capito. Prova con \"ricordami di...\", \"crea lista...\" o dì \"aiuto\"!";
}

/**
 * Calculate Italian national holidays (including Easter via Gauss algorithm)
 */
function getItalianHolidays(year) {
  const holidays = {};
  const fixed = [
    [0,1,'Capodanno'],[0,6,'Epifania'],[3,25,'Liberazione'],
    [4,1,'Festa Lavoratori'],[5,2,'Festa Repubblica'],[7,15,'Ferragosto'],
    [10,1,'Ognissanti'],[11,8,'Immacolata'],[11,25,'Natale'],[11,26,'S. Stefano']
  ];
  fixed.forEach(([m,d,name]) => {
    holidays[dateKey(year, m, d)] = name;
  });
  // Gauss Easter algorithm
  const a = year%19, b = Math.floor(year/100), c = year%100;
  const d2 = Math.floor(b/4), e = b%4;
  const f = Math.floor((b+8)/25), g = Math.floor((b-f+1)/3);
  const h = (19*a+b-d2-g+15)%30;
  const i = Math.floor(c/4), k2 = c%4;
  const l = (32+2*e+2*i-h-k2)%7;
  const m2 = Math.floor((a+11*h+22*l)/451);
  const month = Math.floor((h+l-7*m2+114)/31)-1;
  const day = ((h+l-7*m2+114)%31)+1;
  const easter = new Date(year, month, day);
  holidays[dateKey(year, easter.getMonth(), easter.getDate())] = 'Pasqua';
  const pasquetta = new Date(easter);
  pasquetta.setDate(pasquetta.getDate()+1);
  holidays[dateKey(year, pasquetta.getMonth(), pasquetta.getDate())] = 'Pasquetta';
  return holidays;
}

          if (!grouped[ev.date]) grouped[ev.date] = [];
          grouped[ev.date].push(ev);
        });
        // Sort by time inside each day
        Object.values(grouped).forEach(arr => {
          arr.sort((a,b) => (a.time||"99:99").localeCompare(b.time||"99:99"));
        });
        this.events = grouped;
        this._evCache = {};  // invalida cache eventsOnDay
        Native.scheduleSync();
        // Partial re-render: only rebuild the calendar overlay if it's open.
        // Avoids the full-page reload effect when events sync from another device.

    } catch(e) { console.error(e); showBubble(TETO.error); }
  },

  /* ─── U2: Recurrence expansion ───
     Given a "YYYY-MM-DD" string, return all events that fall on that day
     considering recurrence. Result: array of synthetic event objects (with
     `_originalDate` to know the source). */
  eventsOnDay(dayKey) {
    // Cache LRU semplice: invalida se events è cambiato
    if (!this._evCache) this._evCache = {};
    const cacheKey = dayKey + "_" + Object.keys(this.events).length;
    if (this._evCache[cacheKey]) return this._evCache[cacheKey];

    const result = [];
    const [yy, mm, dd] = dayKey.split("-").map(Number);
    const dayDate = new Date(yy, mm-1, dd);
    const dayDow = dayDate.getDay();

    for (const [origDate, arr] of Object.entries(this.events)) {
      for (const ev of arr) {
        if (origDate === dayKey) {
          // Direct match — original or non-recurring instance
          result.push(ev);
          continue;
        }
        if (!ev.recurrence || ev.recurrence === "none") continue;
        const [oy, om, od] = origDate.split("-").map(Number);
        const origD = new Date(oy, om-1, od);
        if (dayDate < origD) continue;       // recurrence only future
        let matches = false;
        if (ev.recurrence === "daily")        matches = true;
        else if (ev.recurrence === "weekly")  matches = (origD.getDay() === dayDow);
        else if (ev.recurrence === "monthly") matches = (origD.getDate() === dd);
        else if (ev.recurrence === "yearly")  matches = (origD.getMonth() === mm-1 && origD.getDate() === dd);
        if (matches) {
          result.push({ ...ev, _originalDate: origDate, _isRecurrence: true });
        }
      }
    }
    const sorted = result.sort((a,b) => (a.time||"99:99").localeCompare(b.time||"99:99"));
    // Salva in cache (max 60 entry per non occupare troppa memoria)
    if (Object.keys(this._evCache).length > 60) this._evCache = {};
    this._evCache[cacheKey] = sorted;
    return sorted;
  },

  /* ─── U1: Agenda view — flat list of next N days with events ─── */
  agendaNextDays(n = 30) {
    const today = startOfDay(Date.now());
    const result = [];
    for (let i = 0; i < n; i++) {
      const d = new Date(today + i * 86400000);
      const k = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
      const evs = this.eventsOnDay(k);
      if (evs.length > 0) result.push({ key: k, date: d, events: evs });
    }
    return result;
  },

  /* ─── U3: Reminder check — fire notification when reminderOffset matches ─── */
  checkReminders() {
    const now = Date.now();
    const todayKey = dateKey(new Date(now).getFullYear(), new Date(now).getMonth(), new Date(now).getDate());
    const dayEvents = this.eventsOnDay(todayKey);
    for (const ev of dayEvents) {
      if (ev.reminderOffset == null || ev.allDay || !ev.time) continue;
      const [h, m] = ev.time.split(":").map(Number);
      const evMs = new Date().setHours(h, m, 0, 0);
      const fireMs = evMs - ev.reminderOffset * 60000;
      const dedupKey = `${ev.id}_${todayKey}_${ev.reminderOffset}`;
      const _seen = NotifLog.load();
      if (now >= fireMs && now < Math.max(evMs, fireMs + 90000) && !this.notifiedEvents.has(dedupKey) && !_seen["ev:" + dedupKey]) {
        this.notifiedEvents.add(dedupKey);
        _seen["ev:" + dedupKey] = now; NotifLog.save(_seen);
        const leftMin = Math.max(0, Math.round((evMs - now) / 60000));
        const offText = leftMin <= 1 ? "ora" :
                        leftMin >= 60 ? `tra ${Math.round(leftMin/60)}h` :
                        `tra ${leftMin} min`;
        const msg = `📅 ${ev.title} ${offText} (${ev.time})`;
        showBubble(msg);
        if (TTS.enabled) TTS.speak(msg);
        haptic([20, 60, 20]);
        sysNotify("TetoTask 🍞", msg, dedupKey, { scheduled: true });
      }
    }
  },

  /* ─── V1/V2/V3: Voice operations ─── */
  // Find event by partial title match (returns first match in next 60 days)
  findByTitle(query) {
    const q = query.toLowerCase().trim();
    if (!q) return null;
    const today = startOfDay(Date.now());
    for (let i = 0; i < 60; i++) {
      const d = new Date(today + i * 86400000);
      const k = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
      const evs = this.eventsOnDay(k);
      const match = evs.find(e => e.title.toLowerCase().includes(q));
      if (match) return { event: match, dayKey: k, date: d };
    }
    return null;
  },
  async deleteByTitle(query) {
    const found = this.findByTitle(query);
    if (!found) return null;
    // If recurrence instance, delete the whole recurring template (simpler UX)
    const realId = found.event._isRecurrence ? found.event.id : found.event.id;
    await db.collection("users").doc(state.uid).collection("events").doc(realId).delete();
    return found;
  },
  async moveByTitle(query, newDateKey, newTime) {
    const found = this.findByTitle(query);
    if (!found) return null;
    const update = { date: newDateKey };
    if (newTime) update.time = newTime;
    await db.collection("users").doc(state.uid).collection("events").doc(found.event.id).update(update);
    return found;
  },
};

/* ═══════════════════════════════════════════════════════════════
   📝 LISTS MODULE — note e liste personali (film, spesa, ecc.)
   ═══════════════════════════════════════════════════════════════ */
const Lists = {
  open_: false,
  lists: [],                // [{ id, name, emoji, checkable, category, ts }]
  items: {},                // { listId: [{ id, text, done, position, ts }] }
  currentListId: null,
  unsubLists: null,
  unsubItems: {},           // { listId: unsub }
  search: "",               // U-6: detail search query
  editingItemId: null,      // U-1: which item is in inline edit mode
  undoItem: null,           // F-D: last deleted { listId, item, timer }

  findByName(name) {
    if (!name) return null;
    // Normalize: lowercase, strip accents, trim, remove leading articles
    const norm = (s) => String(s || "")
      .toLowerCase()
      .normalize("NFD").replace(/[\u0300-\u036f]/g, "")  // strip accents
      .replace(/^(?:il|lo|la|i|gli|le|l'|un'|un|una|della|dello|dei|degli|delle|del|di|al|alla|allo|ai|agli|alle|per)\s+/g, "")
      .replace(/\s+/g, " ")
      .trim();
    const n = norm(name);
    if (!n) return null;
    // 1. Exact match
    let found = this.lists.find(l => norm(l.name) === n);
    if (found) return found;
    // 2. Query is a prefix of the list name (e.g. "spesa" matches "spesa settimanale")
    found = this.lists.find(l => norm(l.name).startsWith(n));
    if (found) return found;
    // 3. List name is a prefix of the query (e.g. "spesa" list matches "spesa di oggi")
    found = this.lists.find(l => n.startsWith(norm(l.name)));
    if (found) return found;
    // 4. Substring match either way
    found = this.lists.find(l => norm(l.name).includes(n) || n.includes(norm(l.name)));
    return found || null;
  },
  subscribe() {
    if (!state.uid || this.unsubLists) return;
    this.unsubLists = db.collection("users").doc(state.uid).collection("lists")
      .orderBy("ts","desc").onSnapshot(snap => {
        this.lists = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const liveIds = new Set(this.lists.map(l => l.id));
        // Subscribe to items of each list once
        for (const l of this.lists) {
          if (!this.unsubItems[l.id]) this.subscribeItems(l.id);
        }
        // F-F: clean up subscriptions of lists that no longer exist
        for (const id of Object.keys(this.unsubItems)) {
          if (!liveIds.has(id)) {
            try { this.unsubItems[id](); } catch(e) {}
            delete this.unsubItems[id];
            delete this.items[id];
          }
        }
        if (this.open_) renderListsOnly();
      });
  },
  subscribeItems(listId) {
    this.unsubItems[listId] = db.collection("users").doc(state.uid)
      .collection("lists").doc(listId).collection("items")
      .orderBy("ts","desc").onSnapshot(snap => {
        this.items[listId] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        if (this.open_) renderListsOnly();
      });
  },
  resubscribe() {
    if (this.unsubLists) { try { this.unsubLists(); } catch(e) {} this.unsubLists = null; }
    for (const k of Object.keys(this.unsubItems)) {
      try { this.unsubItems[k](); } catch(e) {}
      delete this.unsubItems[k];
    }
    this.lists = [];
    this.items = {};
    if (state.uid) this.subscribe();
  },
  open(listId = null) {
    this.open_ = true;
    this.currentListId = listId;
    this.subscribe();
  },
  close() {
    this.open_ = false;
    this.currentListId = null;
  },
  openList(id) {
    this.currentListId = id;
  },
  back() {
    this.currentListId = null;
  },
  async createList(name, opts = {}) {
    const id = genId();
    const emoji = opts.emoji || guessListEmoji(name);
    const checkable = opts.checkable !== undefined ? opts.checkable : false;
    const category = opts.category || "general";
    await db.collection("users").doc(state.uid).collection("lists").doc(id).set({
      name, emoji, checkable, category, ts: Date.now(),
    });
    return id;
  },
  async deleteList(id) {
    const list = this.lists.find(l => l.id === id);
    const itemCount = (this.items[id] || []).length;
    const detail = list ? `Eliminerai "${list.name}"${itemCount > 0 ? ` e le sue ${itemCount} voci` : ""}.` : "";
    if (!await Modal.confirm(detail, { title: "Eliminare la lista?", danger: true, okLabel: "Elimina" })) return;
    // Delete all items first
    const itemsSnap = await db.collection("users").doc(state.uid)
      .collection("lists").doc(id).collection("items").get();
    const batch = db.batch();
    itemsSnap.forEach(doc => batch.delete(doc.ref));
    batch.delete(db.collection("users").doc(state.uid).collection("lists").doc(id));
    await batch.commit();
    if (this.currentListId === id) this.currentListId = null;
    showBubble("Lista eliminata");
    haptic(10);
    render();
  },
  async toggleCheckable(id, current) {
    await db.collection("users").doc(state.uid).collection("lists").doc(id)
      .update({ checkable: !current });
  },
  async renameList(id, newName, newEmoji = null, newCategory = null) {
    const update = { name: newName };
    if (newEmoji) update.emoji = newEmoji;
    else update.emoji = guessListEmoji(newName);
    if (newCategory) update.category = newCategory;
    await db.collection("users").doc(state.uid).collection("lists").doc(id).update(update);
  },
  async setCategory(id, category) {
    await db.collection("users").doc(state.uid).collection("lists").doc(id)
      .update({ category });
  },
  async addItem(listId, text) {
    if (!text.trim()) return;
    const same = (this.items[listId] || []).find(x => x.text.trim().toLowerCase() === text.trim().toLowerCase());
    if (same) {                                    // "latte" già presente: se era spuntato torna da prendere
      if (same.done) await this.toggleItem(listId, same.id, true);
      return "exists";
    }
    // U-2: pick the highest existing position so new items go to the bottom of pending
    const arr = this.items[listId] || [];
    const maxPos = arr.reduce((a, x) => Math.max(a, x.position ?? 0), 0);
    await db.collection("users").doc(state.uid).collection("lists").doc(listId)
      .collection("items").add({
        text: text.trim(), done: false, position: maxPos + 1, ts: Date.now(),
      });
  },
  async toggleItem(listId, itemId, done) {
    await db.collection("users").doc(state.uid).collection("lists").doc(listId)
      .collection("items").doc(itemId).update({ done: !done });
    haptic(8);
  },
  async deleteItem(listId, itemId) {
    // F-D: store for undo before deleting
    const arr = this.items[listId] || [];
    const item = arr.find(x => x.id === itemId);
    await db.collection("users").doc(state.uid).collection("lists").doc(listId)
      .collection("items").doc(itemId).delete();
    haptic(6);
    if (item) {
      // Cancel previous undo if any
      if (this.undoItem && this.undoItem.timer) clearTimeout(this.undoItem.timer);
      this.undoItem = {
        listId, item,
        timer: setTimeout(() => { this.undoItem = null; renderListsOnly(); }, 6000)
      };
      renderListsOnly();
    }
  },
  async undoDeleteItem() {

/* ─── Reminder helpers ─── */
function startOfDay(ts) { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); }

/* Find first day in next 14 days with no calendar events and ≤2 active tasks (#3) */
function findNextFreeDay() {
  const today = startOfDay(Date.now());
  for (let i = 1; i <= 14; i++) {
    const dayStart = today + i * 86400000;
    const dayEnd   = dayStart + 86400000;
    const d = new Date(dayStart);
    const dayK = dateKey(d.getFullYear(), d.getMonth(), d.getDate());
    const events = (typeof Calendar !== "undefined" ? Calendar.eventsOnDay(dayK) : []);
    if (events.length > 0) continue;
    const tasksThatDay = state.tasks.filter(t => !t.done && t.reminderAt && t.reminderAt >= dayStart && t.reminderAt < dayEnd);
    if (tasksThatDay.length <= 2) return dayStart;
  }
  return null;
}
function getReminderStatus(ts) {
  if (!ts) return null;
  const now = Date.now();
  const today = startOfDay(now);
  const tomorrow = today + 86400000;
  if (ts < now) return "overdue";
  if (ts < tomorrow) return "today";
  return "future";
}
function formatReminder(ts) {
  if (!ts) return "";
  const now = Date.now();
  const diff = ts - now;
  const absMin = Math.abs(Math.round(diff / 60000));
  if (diff < 0) {
    if (absMin < 60) return `scaduto ${absMin}m fa`;
    if (absMin < 1440) return `scaduto ${Math.round(absMin/60)}h fa`;
    return `scaduto ${Math.round(absMin/1440)}g fa`;
  }
  if (absMin < 60) return `tra ${absMin}m`;
  if (absMin < 1440) {
    const d = new Date(ts);
    return `alle ${d.getHours().toString().padStart(2,"0")}:${d.getMinutes().toString().padStart(2,"0")}`;
  }
  const d = new Date(ts);
  return d.toLocaleDateString("it-IT",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"});
}
function toDatetimeLocal(ts) {
  if (!ts) return "";
  const d = new Date(ts);
  const pad = n => n.toString().padStart(2,"0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

/* ─── Notifications ─── */
async function requestNotifPermission() {
  if (Native.on) return Native.requestPermission();
  if (!("Notification" in window)) return false;
  if (Notification.permission === "granted") return true;
  if (Notification.permission === "denied") return false;
  const p = await Notification.requestPermission();
  return p === "granted";
}
// Android Chrome vieta `new Notification()` ("Illegal constructor"):
// le notifiche vanno mostrate tramite il Service Worker.
async function sysNotify(title, body, tag, extra) {
  if (Native.on) {
    // Task, eventi e timer sono già programmati nel telefono: qui solo quelle immediate (test, casa)
    if (extra && extra.scheduled) return true;
    return Native.now(title, body);
  }
  if (!("Notification" in window) || Notification.permission !== "granted") return false;
  const opts = { body, icon: "./icon-192.png", badge: "./icon-192.png", tag: tag || "tetotask",
                 renotify: true, vibrate: [120, 60, 120],
                 data: { url: location.href.split("?")[0].split("#")[0], ...((extra && extra.data) || {}) } };
  if (extra && extra.actions) opts.actions = extra.actions;
  try {
    if ("serviceWorker" in navigator) {
      const reg = await navigator.serviceWorker.getRegistration() ||
                  await Promise.race([navigator.serviceWorker.ready, new Promise(r => setTimeout(() => r(null), 3000))]);
      if (reg && reg.showNotification) { await reg.showNotification(title, opts); return true; }
    }
  } catch(e) { console.warn("SW notification failed:", e); }
  try { const o = { ...opts }; delete o.actions; new Notification(title, o); return true; } catch(e) { return false; }
}
function notify(title, body, tag, extra) { sysNotify(title, body, tag, extra); }

/* ─── Registro notifiche già inviate (persistente: niente doppioni dopo un riavvio) ─── */
const NotifLog = {
  KEY: "teto-notified-v2",
  load() { try { return JSON.parse(localStorage.getItem(this.KEY) || "{}"); } catch(e) { return {}; } },
  save(o) {
    const cutoff = Date.now() - 3 * 86400000;
    for (const k in o) if (o[k] < cutoff) delete o[k];
    try { localStorage.setItem(this.KEY, JSON.stringify(o)); } catch(e) {}
  },
};

/* ─── Due reminders checker ─── */
function checkDueReminders() {
  const now = Date.now();
  let fired = false;
  const seen = NotifLog.load();
  for (const t of state.tasks) {
    if (t.done || !t.reminderAt) continue;
    const kDue = t.id + ":" + t.reminderAt + ":due", kSoon = t.id + ":" + t.reminderAt + ":soon";
    if (t.reminderAt <= now) {
      if (seen[kDue]) continue;
      seen[kDue] = now; seen[kSoon] = seen[kSoon] || now;
      showBubble(TETO.overdue(t.text));
      notify("TetoTask 🍞", `${t.text} — è il momento!`, "task-" + t.id, {
        actions: [{ action: "done", title: "✓ Fatto" }, { action: "snooze", title: "⏰ +10 min" }],
        data: { taskId: t.id }, scheduled: true,
      });
      fired = true;
    } else if (t.reminderAt - now <= 5*60*1000) {
      if (seen[kSoon]) continue;
      seen[kSoon] = now;
      showBubble(TETO.dueSoon(t.text));
      notify("TetoTask 🍞", `${t.text} — tra poco!`, "task-" + t.id, { scheduled: true });
      fired = true;
    }
  }
  if (fired) NotifLog.save(seen);
  return fired;
}
// Only re-render when something actually changes, and never when calendar/lists
// are open (avoids the disruptive full-page refresh the user complained about).
setInterval(() => {
  if (!state.ready) return;
  const fired = checkDueReminders();
  // U3: also fire calendar event reminders
  Calendar.checkReminders();
  if (fired && !Calendar.open_ && !Lists.open_ && !state.showSettings && !state.showHelp) {
    render();

}, 30000);

// Quando l'app torna in primo piano (Android sospende i timer in background)

});

// Render raggruppato: più richieste nello stesso frame = un solo render
let _renderQueued = false;
function requestRender() {
  if (_renderQueued) return;
  _renderQueued = true;
  const run = () => { if (!_renderQueued) return; _renderQueued = false; render(); };
  if (document.visibilityState === "visible" && window.requestAnimationFrame) requestAnimationFrame(run);
  else setTimeout(run, 0);
}

function showBubble(text, opts = {}) {
  state.bubble = text;
  // Aggiorna subito il fumetto, poi un unico render completo nel prossimo frame
  document.querySelectorAll(".bubble, .focus-bubble").forEach(el => { el.textContent = text; });
  requestRender();
  // Speak unless silent flag passed or mic is listening (avoid feedback loop).
  // TTS.speak() sanitizes emojis/tildes internally now.
  if (!opts.silent && !state.listening) {
    TTS.speak(text);
  }
  clearTimeout(bubbleTimeout);
  bubbleTimeout = setTimeout(() => {}, 5000);
}

/* ─── Confetti (Teto-themed particles on task completion) ─── */
function confetti(originX, originY) {
  const symbols = ["♪", "♫", "✨", "🍞", "♡", "★"];
  const colors  = ["#ff2f5e", "#ff85ad", "#e85c7f", "#ffb84d", "#a31540"];
  const count = 14;
  const host = document.body;
  for (let i = 0; i < count; i++) {
    const el = document.createElement("span");
    el.className = "confetti-piece";
    el.textContent = symbols[Math.floor(Math.random() * symbols.length)];
    el.style.color = colors[Math.floor(Math.random() * colors.length)];
    el.style.left = originX + "px";
    el.style.top  = originY + "px";
    // random direction
    const angle = (Math.random() * 2 - 1) * Math.PI / 2 - Math.PI / 2;  // upward fan
    const speed = 80 + Math.random() * 120;
    const dx = Math.cos(angle) * speed;
    const dy = Math.sin(angle) * speed;
    const rot = (Math.random() * 720 - 360);
    const size = 14 + Math.random() * 14;
    el.style.fontSize = size + "px";
    el.style.setProperty("--dx", dx + "px");
    el.style.setProperty("--dy", dy + "px");
    el.style.setProperty("--rot", rot + "deg");
    host.appendChild(el);
    setTimeout(() => el.remove(), 1400);
  }
}

/* ─── Swipe gestures on task cards ─── */
const Swipe = {
  THRESHOLD: 80,      // px before action triggers
  MAX_OFFSET: 160,    // visual cap
  startX: 0, startY: 0, currentDx: 0,
  card: null, taskId: null, active: false, locked: null,

  onStart(e) {
    const target = e.target.closest(".task-card");
    if (!target) return;
    if (e.target.closest("button, input, textarea, .expand-area")) return;
    const id = target.getAttribute("data-task-id");
    if (state.expanded === id || state.editText === id || state.editNote === id) return;
    this.active = true;
    this.locked = null;
    this.card = target;
    this.taskId = id;
    this.startX = e.touches[0].clientX;
    this.startY = e.touches[0].clientY;
    this.currentDx = 0;
  },
  onMove(e) {
    if (!this.active) return;
    const dx = e.touches[0].clientX - this.startX;
    const dy = e.touches[0].clientY - this.startY;
    if (!this.locked) {
      if (Math.abs(dx) > 12 || Math.abs(dy) > 12) {
        this.locked = Math.abs(dx) > Math.abs(dy) ? "h" : "v";
      }
    }
    if (this.locked !== "h") return;
    e.preventDefault();
    const clamped = Math.max(-this.MAX_OFFSET, Math.min(this.MAX_OFFSET, dx));
    this.currentDx = clamped;
    this.card.style.transform = `translateX(${clamped}px)`;
    const pct = Math.min(1, Math.abs(clamped) / this.THRESHOLD);
    if (clamped > 0) {
      this.card.style.boxShadow = `inset 8px 0 0 rgba(76,175,80,${pct*0.7}), 0 2px 10px rgba(255,47,94,.08)`;
    } else {
      this.card.style.boxShadow = `inset -8px 0 0 rgba(255,47,94,${pct*0.7}), 0 2px 10px rgba(255,47,94,.08)`;
    }
  },
  onEnd() {
    if (!this.active) return;
    const wasHoriz = this.locked === "h";
    const dx = this.currentDx;
    const card = this.card;
    const id = this.taskId;
    if (card) {
      card.style.transition = "transform .25s ease, box-shadow .25s ease";
      card.style.transform = "";
      card.style.boxShadow = "";
      setTimeout(() => { if (card) card.style.transition = ""; }, 300);
    }
    if (wasHoriz && Math.abs(dx) >= this.THRESHOLD && id) {
      if (dx > 0) toggleDone(id);
      else deleteTask(id);
    }
    this.active = false;
    this.card = null; this.taskId = null; this.locked = null; this.currentDx = 0;
  },
  init() {
    document.addEventListener("touchstart", e => this.onStart(e), { passive: true });
    document.addEventListener("touchmove",  e => this.onMove(e),  { passive: false });
    document.addEventListener("touchend",   () => this.onEnd(),   { passive: true });
    document.addEventListener("touchcancel",() => this.onEnd(),   { passive: true });
  },
};
Swipe.init();

async function deleteTaskFromDb(id) {
  try {
    await tasksRef().doc(id).delete();
  } catch(e) { console.error("Delete failed:", e); }
}

function listenToTasks() {
  if (unsubFirestore) { try { unsubFirestore(); } catch(e){} }
  unsubFirestore = tasksRef().orderBy("ts","desc").onSnapshot(snap => {
    state.tasks = snap.docs.map(d => ({ id:d.id, ...d.data() }));
    Native.scheduleSync();
    if (_pendingNotifAction) setTimeout(() => _pendingNotifAction && handleNotifAction(_pendingNotifAction.action, _pendingNotifAction.taskId), 0);
    // Solo re-render se la vista principale è attiva
    if (!Calendar.open_ && !Lists.open_ && !state.showSettings && !state.showHelp && !state.focusMode) {
      requestRender();
    }
  }, err => {
    console.error("Firestore listen error:", err);
    // Retry automatico dopo 3s su errore di rete
    setTimeout(() => { if (state.uid) listenToTasks(); }, 3000);
  });
}

/* ─── Voice ─── */
function toggleMic() {
  if (Native.on) { Native.listen(); return; }
  if (state.listening) {
    recognition?.stop();
    state.listening = false;
    render();
    // Command mic cancelled by user — restore wake word listener
    WAKE.resume();
    return;
  }
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showBubble(TETO.noVoice); return; }

  // Pause the wake listener: only one recognizer can be active per tab
  WAKE.pause();

  // CRITICAL: stop any ongoing TTS so the mic doesn't record Teto's own voice
  TTS.stop();

  recognition = new SR();
  recognition.lang = "it-IT";
  recognition.continuous = false;
  recognition.interimResults = true;   // mostra in diretta cosa sta capendo
  recognition.onresult = async e => {
    const res = e.results[e.results.length - 1];
    if (!res.isFinal) {
      const inp = document.getElementById("taskInput");
      if (inp) inp.value = Array.from(e.results).map(r => r[0].transcript).join("");
      return;
    }
    const transcript = Array.from(e.results).map(r => r[0].transcript).join("").trim();
    if (!transcript) return;
    state.listening = false;
    state.input = "";  // we'll execute directly
    render();
    haptic(10);
    try {
      await processUserCommand(transcript, "voice");
    } catch (err) {
      console.error("Intent execution error:", err);
      // Fallback: treat as plain task
      state.input = transcript;
      render();
      setTimeout(() => document.getElementById("taskInput")?.focus(), 100);
    }
  };
  recognition.onerror = (ev) => {
    state.listening = false;
    const code = ev && ev.error;
    if (code === "no-speech" || code === "aborted") {
      showBubble("Non ho sentito niente~ riprova quando vuoi 🎤", {silent:true});
    } else if (code === "not-allowed" || code === "service-not-allowed") {
      showBubble("Mi serve il permesso del microfono: toccalo nelle impostazioni del sito/app e consenti 🎤", {silent:true});
    } else if (code === "network") {
      showBubble("Il riconoscimento vocale ha bisogno di internet~ scrivimi pure intanto ✍️", {silent:true});
    } else {
      showBubble(TETO.voiceErr, {silent:true});
    }
    render();
    WAKE.resume();
  };
  recognition.onend = () => {
    state.listening = false;
    render();
    WAKE.resume();
  };

  // Small delay so any just-cancelled TTS / wake recognizer is fully stopped
  // before the command mic opens (mic hardware needs a brief release window).
  setTimeout(() => {
    try { recognition.start(); }
    catch(e) {
      state.listening = false;
      showBubble(TETO.voiceErr, {silent:true});
      WAKE.resume();
      return;
    }
    state.listening = true;
    // "Ti ascolto" is shown VISUALLY only — not spoken, to avoid mic feedback
    showBubble(TETO.listen, {silent:true});
    haptic(15);
    render();
  }, 200);
}

/* ─── Actions ─── */
async function addTask() {
  const text = state.input.trim();
  if (!text) return;
  // If user explicitly set a reminder via picker, treat as plain task w/ reminder
  if (state.reminderAt) {
    const task = {
      id:genId(), text, category:state.cat, note:"", done:false, ts:Date.now(),
      reminderAt: state.reminderAt,
    };
    state.input = "";
    state.reminderAt = null;
    state.showReminderPicker = false;
    await addTaskToDb(task);
    showBubble(TETO.remSet);
    haptic(12);
    requestNotifPermission();
    return;
  }
  // Otherwise route through intent parser so typing behaves like voice
  state.input = "";
  render();
  try {
    await processUserCommand(text, "text");
    haptic(10);
  } catch (err) {
    console.error("Intent error:", err);
    // Fallback: plain task
    const task = { id:genId(), text, category:state.cat, note:"", done:false, ts:Date.now(), reminderAt:null };
    await addTaskToDb(task);
    showBubble(pick(TETO.added));
  }
}


/* Completa un task: se è ricorrente lo ripianifica alla prossima volta */
async function completeTaskSmart(t) {
  if (t.repeat && t.reminderAt) {
    const next = nextRepeat(t.reminderAt, t.repeat, t.repeatAt);
    await updateTaskInDb(t.id, { reminderAt: next, lastDoneAt: Date.now() });
    return next;
  }
  await updateTaskInDb(t.id, { done: true });
  return null;
}
function toggleDone(id) {
  const t = state.tasks.find(x=>x.id===id);
  if (!t) return;
  if (!t.done && t.repeat && t.reminderAt) {
    completeTaskSmart(t).then(next => showBubble(`Fatto! 🔁 Prossima volta ${friendlyWhen(next)}`));
    haptic(20);
    const btn = document.querySelector(`[data-task-id="${id}"] .check-btn`);
    if (btn) { const r = btn.getBoundingClientRect(); confetti(r.left + r.width/2, r.top + r.height/2); }
    return;
  }
  updateTaskInDb(id, { done:!t.done });
  if (!t.done) {
    showBubble(pick(TETO.done));
    haptic(20);
    // Fire confetti from the check button position
    const btn = document.querySelector(`[data-task-id="${id}"] .check-btn`);
    if (btn) {
      const r = btn.getBoundingClientRect();
      confetti(r.left + r.width/2, r.top + r.height/2);
    }
    // Flag for celebrate animation on the next render (#5)
    state.celebratingId = id;
    setTimeout(() => { state.celebratingId = null; }, 900);
  }
  else haptic(8);
}

function deleteTask(id) {
  const t = state.tasks.find(x=>x.id===id);
  if (!t) return;
  state.undoTask = { ...t };
  deleteTaskFromDb(id);
  if (state.expanded===id) state.expanded=null;
  showBubble(TETO.deleted);
  haptic(15);
  clearTimeout(undoTimer);
  undoTimer = setTimeout(() => { state.undoTask = null; render(); }, 6000);
  render();
}

async function undoDelete() {
  if (!state.undoTask) return;
  const t = state.undoTask;
  state.undoTask = null;
  clearTimeout(undoTimer);
  await addTaskToDb(t);
  showBubble(TETO.undone);
  haptic(10);
  render();
}

function saveNote(id) {
  updateTaskInDb(id, { note:state.noteVal });
  state.editNote = null;
  haptic(8);
  render();
}

function saveTaskText(id) {
  const newText = state.editTextVal.trim();
  if (newText && newText !== state.tasks.find(x=>x.id===id)?.text) {
    updateTaskInDb(id, { text: newText });
    showBubble(TETO.edited);
    haptic(8);
  }
  state.editText = null;
  state.editTextVal = "";
  render();
}

function setReminderPreset(preset) {
  const now = new Date();
  let ts;
  if (preset === "30m") ts = Date.now() + 30*60*1000;
  else if (preset === "1h") ts = Date.now() + 60*60*1000;
  else if (preset === "2h") ts = Date.now() + 2*60*60*1000;
  else if (preset === "tonight") {
    const d = new Date(); d.setHours(20,0,0,0);
    if (d.getTime() < Date.now()) d.setDate(d.getDate()+1);
    ts = d.getTime();
  }
  else if (preset === "tomorrow9") {
    const d = new Date(); d.setDate(d.getDate()+1); d.setHours(9,0,0,0);
    ts = d.getTime();
  }
  else if (preset === "tomorrow18") {
    const d = new Date(); d.setDate(d.getDate()+1); d.setHours(18,0,0,0);
    ts = d.getTime();
  }
  state.reminderAt = ts;
  haptic(8);
  render();
}

/* ─── Hero helpers (#1) ─── */
function heroGreet() {
  const h = new Date().getHours();
  if (h >= 5  && h < 12) return "Buongiorno";
  if (h >= 12 && h < 18) return "Buon pomeriggio";
  if (h >= 18 && h < 23) return "Buonasera";
  return "Buonanotte";
}
function heroDate() {
  const d = new Date();
  return d.toLocaleDateString("it-IT", { weekday: "long", day: "numeric", month: "long" });
}
/* "Today" relevance: tasks with reminder today, plus active inbox items */
function computeTodayProgress(tasks) {
  const todayStart = startOfDay(Date.now());
  const tomorrowStart = todayStart + 86400000;
  const todayRelevant = tasks.filter(t => {
    const r = t.reminderAt;
    if (r && r >= todayStart && r < tomorrowStart) return true;
    if (!r && !t.done) return true;
    return false;
  });
  const done = todayRelevant.filter(t => t.done).length;
  const total = todayRelevant.length;
  const pct = total ? Math.round(done / total * 100) : 0;
  return { done, total, pct };
}

/* ─── Mascot mood (#3) ─── */
function mascotMood() {
  if (state.listening) return "🎤";
  const total = state.tasks.length;
  if (total === 0) return "💤";
  const active = state.tasks.filter(t => !t.done).length;
  if (active === 0) return "🎉";
  const overdue = state.tasks.filter(t => !t.done && t.reminderAt && getReminderStatus(t.reminderAt) === "overdue").length;
  if (overdue > 0) return "⚠️";
  const { pct } = computeTodayProgress(state.tasks);
  if (pct >= 66) return "🌟";
  return "🎵";
}
function mascotMoodTitle() {
  const m = mascotMood();
  return {
    "🎤": "In ascolto...",
    "💤": "Lista vuota, riposati!",
    "🎉": "Tutto fatto~",
    "⚠️": "Qualcosa è in ritardo!",
    "🌟": "Buon ritmo!",
    "🎵": "Al lavoro~",
  }[m] || "";
}

function speakTask(id) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  if (!window.speechSynthesis && !Native.on) { showBubble("Il tuo browser non supporta la voce 😢"); return; }
  // Force TTS on temporarily if user pressed speak-button
  const wasEnabled = TTS.enabled;
  TTS.enabled = true;
  const text = t.text + (t.note ? ". " + t.note : "");
  TTS.speak(text);
  TTS.enabled = wasEnabled;
}

/* ─── Render ─── */
function computeStreak() {
  try {
    const KEY = "teto_streak";
    const data = JSON.parse(localStorage.getItem(KEY) || '{"days":0,"last":null}');
    const todayStr = new Date().toISOString().slice(0,10);
    if (data.last === todayStr) return data.days;
    const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
    const newDays = data.last === yesterday
      ? data.days + 1
      : (state.tasks.some(t => t.done && new Date(t.ts).toISOString().slice(0,10) === todayStr) ? 1 : 0);
    if (newDays > 0) localStorage.setItem(KEY, JSON.stringify({days:newDays, last:todayStr}));
    return newDays;
  } catch(e) { return 0; }
}

function globalSearchResults() {
  const q = (state.globalSearch || "").toLowerCase().trim();
  if (!q || q.length < 2) return null;
  const tasks = state.tasks.filter(t =>
    t.text.toLowerCase().includes(q) || (t.note||"").toLowerCase().includes(q));
  const listItems = [];
  for (const l of Lists.lists) {
    const its = (Lists.items[l.id]||[]).filter(i => i.text.toLowerCase().includes(q));
    if (its.length) listItems.push({ list: l, items: its });
  }
  const events = [];
  for (const arr of Object.values(Calendar.events || {})) {
    for (const e of arr) {
      if ((e.title||"").toLowerCase().includes(q) || (e.note||"").toLowerCase().includes(q))
        events.push(e);
    }
  }
  const total = tasks.length + events.length + listItems.reduce((a,x) => a + x.items.length, 0);
  return { tasks, events, listItems, total, q };
}

function smartHintHTML() {
  const raw = (state.input || "").trim();
  if (raw.length < 3) return "";
  try {
    const it = detectIntent(raw);
    const fmt = ts => new Date(ts).toLocaleString("it-IT", { weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit" });
    if (it) {
      if (it.kind === "event" && it.timestamp) return `<div class="smart-hint">📅 Evento: <strong>${esc(it.title||"")}</strong> — ${fmt(it.timestamp)} · premi invio~</div>`;
      if (it.kind === "task" && it.reminderAt) return `<div class="smart-hint">${it.repeat ? "🔁" : "⏰"} Task: <strong>${esc(capFirst(it.text||""))}</strong> — ${esc(friendlyWhen(it.reminderAt))}${it.repeat ? " · " + REPEAT_LABEL[it.repeat] : ""}${it.category === "urgente" ? " · ⚡" : it.category === "lavoro" ? " · 💼" : ""}</div>`;
      if (it.kind === "list_add" && it.listName) {
        const l = Lists.findByName(it.listName);
        const n = (it.items || []).length;
        if (l) return `<div class="smart-hint">📝 Aggiungo a <strong>${l.emoji} ${esc(l.name)}</strong>${n > 1 ? `: ${esc(it.items.join(", "))}` : ""} — premi invio~</div>`;
      }
      if (it.kind === "list_check") return `<div class="smart-hint">✓ Spunto <strong>${esc(it.item||"")}</strong> da ${esc(it.listName||"")}</div>`;
      if (it.kind === "complete_task") { const tk = findTaskFuzzy(it.query); if (tk) return `<div class="smart-hint">✓ Completo <strong>${esc(tk.text)}</strong></div>`; }
      if (it.kind === "math" && it.result != null) return `<div class="smart-hint">🧮 = <strong>${esc(formatMathResult(it.result))}</strong></div>`;
    }
  } catch(e) {}
  if (GeminiAgent.enabled && (window.tetoAI || GeminiAgent.apiKey) && raw.length > 4)
    return `<div class="smart-hint">✨ Gemini attivo — puoi scrivere in modo naturale</div>`;
  return "";
}

/* ─── Avvio da scorciatoia / condivisione / notifica ─── */
function handleLaunchParams() {
  let q;
  try { q = new URLSearchParams(location.search); } catch(e) { return; }
  if (![...q.keys()].length) return;
  const open = q.get("open"), notif = q.get("notif"), task = q.get("task");
  const title = q.get("share_title") || "", text = q.get("share_text") || "", url = q.get("share_url") || "";
  const shared = [title, text, (url && !text.includes(url)) ? url : ""].filter(Boolean).join(" ").replace(/\s+/g, " ").trim();
  // Pulisce l'URL così un ricaricamento non ripete l'azione
  try { history.replaceState(null, "", location.pathname); } catch(e) {}
  if (notif && task) handleNotifAction(notif, task);
  if (open === "calendar") { Calendar.open(); render(); }
  else if (open === "lists") { Lists.open(); render(); }
  else if (open === "new") setTimeout(() => document.getElementById("taskInput")?.focus(), 300);
  if (shared) {
    state.input = shared.slice(0, 300);
    render();
    showBubble("Mi hai condiviso qualcosa~ premi invio per salvarlo 🍞", { silent: true });
    localStorage.setItem("teto-seen-onboarding", "1");
  }
}

function placeSentence(item, place) {
  const it = String(item || "").trim();
  const plural = /^(?:le|i|gli)\s/i.test(it) || (!/^(?:il|lo|la|l'|un|una|uno)\s?/i.test(it) && /[ie]$/i.test(it.split(/\s+/)[0]));
  return `${it} ${plural ? "sono" : "è"} ${place}`;
}
function resolveTaskRef() {
  const ids = [state.expanded, state.lastTaskRef, state.lastAction && state.lastAction.kind === "task_create" ? state.lastAction.id : null];
  for (const id of ids) { const t = id && state.tasks.find(x => x.id === id); if (t) return t; }
  return null;
}
function capFirst(s) { s = String(s || "").trim(); return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function localDayKey(d = new Date()) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function friendlyWhen(ts) {
  const d = new Date(ts), now = new Date();
  const hm = d.toLocaleTimeString("it-IT", { hour:"2-digit", minute:"2-digit" });
  const day0 = x => new Date(x.getFullYear(), x.getMonth(), x.getDate()).getTime();
  const diff = Math.round((day0(d) - day0(now)) / 86400000);
  if (diff === 0) return "oggi alle " + hm;
  if (diff === 1) return "domani alle " + hm;
  return d.toLocaleDateString("it-IT", { weekday:"long", day:"numeric", month:"short" }) + " alle " + hm;
}

/* ─── Rimanda / imposta promemoria di un task ─── */
async function snoozeTask(id, how) {
  const t = state.tasks.find(x => x.id === id);
  if (!t) return;
  let at = null;
  const d = new Date();
  if (typeof how === "number") at = Date.now() + how * 60000;
  else if (how === "tonight") { d.setHours(20, 0, 0, 0); if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1); at = d.getTime(); }
  else if (how === "tomorrow") { d.setDate(d.getDate() + 1); d.setHours(9, 0, 0, 0); at = d.getTime(); }
  if (at) {
    // Evita il doppio avviso "tra poco" per i rinvii brevi
    if (at - Date.now() <= 10 * 60000) { const seen = NotifLog.load(); seen[id + ":" + at + ":soon"] = Date.now(); NotifLog.save(seen); }
    requestNotifPermission();
  }
  await updateTaskInDb(id, { reminderAt: at });
  haptic(10);
  showBubble(at ? `Ok, te lo ricordo ${friendlyWhen(at)} ⏰` : "Promemoria tolto~");
}

/* ─── Azioni dalle notifiche (✓ Fatto / ⏰ +10 min) ─── */
let _pendingNotifAction = null;
function handleNotifAction(action, taskId) {
  const t = state.tasks.find(x => x.id === taskId);
  if (!t) { _pendingNotifAction = { action, taskId }; return; }   // task non ancora caricati
  _pendingNotifAction = null;
  if (action === "done" && !t.done) {
    completeTaskSmart(t).then(next => showBubble(next ? `Fatto! 🔁 Prossima volta ${friendlyWhen(next)}` : pick(TETO.done)));
  }
  else if (action === "snooze") snoozeTask(taskId, 10);
}
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.addEventListener("message", e => {
    if (e.data && e.data.type === "notif-action") handleNotifAction(e.data.action, e.data.taskId);
  });
}

function setupCalendarSwipe() {
  const grid = document.getElementById("cal-grid-swipe");
  if (!grid || grid._swipeBound) return;
  grid._swipeBound = true;
  let startX = null, startY = null;
  grid.addEventListener("touchstart", (e) => {
    if (e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
  }, { passive: true });
  grid.addEventListener("touchend", (e) => {
    if (startX == null) return;
    const dx = e.changedTouches[0].clientX - startX;
    const dy = e.changedTouches[0].clientY - startY;
    startX = startY = null;
    if (Math.abs(dx) < 50 || Math.abs(dy) > Math.abs(dx)) return;  // mostly horizontal, min 50px
    if (dx < 0) Calendar.next(); else Calendar.prev();
    renderCalendarOnly();
  }, { passive: true });
}

/**
 * Partial re-renders: update only the calendar or lists overlay instead
 * of rebuilding the entire #app innerHTML. This fixes the "click on day
 * reloads the whole calendar" bug — the overlay now updates in place,
 * keeping scroll position and avoiding a visual flash.
 */
function renderCalendarOnly() {
  if (!Calendar.open_) { render(); return; }
  // F2: if the form is open, only update parts that don't include it,
  // so input focus and caret position are preserved.
  if (Calendar.showForm) {
    const existingForm = document.querySelector(".cal-form-overlay");
    if (existingForm) return;   // form is mounted, leave it untouched
  }
  const existing = document.querySelector(".cal-overlay");
  if (!existing) { render(); return; }
  const wrapper = document.createElement("div");
  wrapper.innerHTML = renderCalendar();
  const fresh = wrapper.firstElementChild;
  if (fresh) {
    existing.replaceWith(fresh);
    setupCalendarSwipe();
  }
  else render();
}
function renderListsOnly() {
  if (!Lists.open_) { render(); return; }
  // Find the lists overlay: it shares the .cal-overlay class but is uniquely identified
  // by the "Liste" close handler. Find by querying the panel content marker.
  const allOverlays = document.querySelectorAll(".cal-overlay");
  let existing = null;
  for (const ov of allOverlays) {
    // Heuristic: lists overlay has the "Liste" back button OR the lists grid OR the lists title
    if (ov.querySelector(".lists-back, .lists-grid, .lists-title-row")) { existing = ov; break; }
  }
  if (!existing) { render(); return; }

  // F-B: preserve focus state of inputs that survive the re-render
  const focusedEl = document.activeElement;
  const wasFocusedAddInput = focusedEl && focusedEl.id === "listAddInput";
  const wasFocusedSearch   = focusedEl && focusedEl.classList.contains("list-search");
  const wasFocusedEdit     = focusedEl && focusedEl.classList.contains("list-item-edit-input");
  const focusedEditId      = wasFocusedEdit ? focusedEl.id : null;
  const carryValue         = wasFocusedAddInput ? focusedEl.value : null;
  const carryCaretStart    = focusedEl?.selectionStart ?? null;
  const carryCaretEnd      = focusedEl?.selectionEnd ?? null;
  const scrollTop          = existing.querySelector(".cal-panel")?.scrollTop || 0;

  const wrapper = document.createElement("div");
  wrapper.innerHTML = renderLists();
  const fresh = wrapper.firstElementChild;
  if (!fresh) { render(); return; }
  existing.replaceWith(fresh);

  // Restore scroll
  const newPanel = fresh.querySelector(".cal-panel");
  if (newPanel) newPanel.scrollTop = scrollTop;

  // Restore focus + value + caret
  if (wasFocusedAddInput) {
    const input = fresh.querySelector("#listAddInput");
    if (input) {
      if (carryValue !== null) input.value = carryValue;
      input.focus();
      try { input.setSelectionRange(carryCaretStart ?? input.value.length, carryCaretEnd ?? input.value.length); } catch(e) {}
    }
  } else if (wasFocusedSearch) {
    const input = fresh.querySelector(".list-search");
    if (input) {
      input.focus();
      try { input.setSelectionRange(carryCaretStart ?? input.value.length, carryCaretEnd ?? input.value.length); } catch(e) {}
    }
  } else if (wasFocusedEdit && focusedEditId) {
    const input = fresh.querySelector("#" + focusedEditId);
    if (input) {
      input.focus();
      try { input.setSelectionRange(carryCaretStart ?? input.value.length, carryCaretEnd ?? input.value.length); } catch(e) {}
    }
  }
}

function renderCalendar() {
  const c = Calendar;
  const holidays = getItalianHolidays(c.year);
  const cells = [];

  // Build month grid (only used in month view)
  const firstDay = new Date(c.year, c.month, 1).getDay(); // 0=Sun
  const offset = (firstDay + 6) % 7; // Italian week: Mon=0
  const daysInMonth = new Date(c.year, c.month+1, 0).getDate();
  const today = new Date();
  const todayKey = dateKey(today.getFullYear(), today.getMonth(), today.getDate());

  if (c.view === "month") {
    for (let i = 0; i < offset; i++) cells.push(`<div class="cal-cell cal-empty"></div>`);
    for (let d = 1; d <= daysInMonth; d++) {
      const k = dateKey(c.year, c.month, d);
      const dow = new Date(c.year, c.month, d).getDay();
      const isWeekend = (dow === 0 || dow === 6);
      const isToday = (k === todayKey);
      const isSelected = (k === c.selectedDate);
      const isHoliday = !!holidays[k];
      const dayEvts = c.eventsOnDay(k);
      const hasEvents = dayEvts.length > 0;
      const hasTaskRem = state.tasks.some(t => t.reminderAt && !t.done &&
        dateKey(new Date(t.reminderAt).getFullYear(), new Date(t.reminderAt).getMonth(), new Date(t.reminderAt).getDate()) === k);
      // U4: pick up to 2 distinct category colors as small bars on the cell
      const cats = [...new Set(dayEvts.map(e => e.category || "personal"))].slice(0, 2);
      const classes = ["cal-cell"];
      if (isWeekend) classes.push("weekend");
      if (isToday) classes.push("today");
      if (isSelected) classes.push("selected");
      if (isHoliday) classes.push("holiday");
      const catBars = cats.map(cid => {
        const cat = EVENT_CAT_BY_ID[cid] || EVENT_CAT_BY_ID.personal;
        return `<span class="cal-cat-bar" style="background:${cat.color}"></span>`;
      }).join("");
      cells.push(`<div class="${classes.join(' ')}" onclick="Calendar.selectDay('${k}');renderCalendarOnly()">
        <div class="cal-cell-num">${d}</div>
        ${catBars ? `<div class="cal-cat-bars">${catBars}</div>` : ""}
        <div class="cal-dots">

    dateKey(new Date(t.reminderAt).getFullYear(), new Date(t.reminderAt).getMonth(), new Date(t.reminderAt).getDate()) === c.selectedDate);

  const [sy, sm, sd] = (c.selectedDate || "").split("-").map(Number);
  const selDate = c.selectedDate ? new Date(sy, sm-1, sd) : null;
  const selLabel = selDate ? selDate.toLocaleDateString("it-IT",{weekday:"long",day:"numeric",month:"long"}) : "";

  const hourOpts = Array.from({length:24},(_,i)=>String(i).padStart(2,'0'))
    .map(h=>`<option value="${h}" ${h===c.formHour?'selected':''}>${h}</option>`).join("");
  const minOpts  = ["00","05","10","15","20","25","30","35","40","45","50","55"]
    .map(m=>`<option value="${m}" ${m===c.formMin?'selected':''}>${m}</option>`).join("");

    return `<div class="cal-event-item" style="border-left-color:${cat.color}">

    </div>

    ${c.selectedDate ? `<div class="cal-day-detail">

        <div class="cal-day-label">${selLabel}</div>

          <span class="cal-task-text">${esc(t.text)}</span>
        </div>`).join("")}
      </div>` : ''}

      <div class="cal-subsection">
        <div class="cal-subsection-title">📆 Eventi</div>
        ${selEvents.length === 0 ? `<div class="cal-empty-msg">Nessun evento per questo giorno</div>` : ''}
        ${selEvents.map(ev => renderEventItem(ev)).join("")}
      </div>

      <button class="cal-add-btn" onclick="Calendar.openForm();renderCalendarOnly()">
        + Aggiungi evento
      </button>
    </div>` : ''}
  `;

  const agendaItems = c.agendaNextDays(60);
  const agendaBody = agendaItems.length === 0
    ? `<div class="cal-empty-msg" style="margin-top:16px">Nessun evento nei prossimi 60 giorni~ ♪</div>`
    : agendaItems.map(g => `<div class="cal-agenda-day">
        <div class="cal-agenda-date ${g.key === todayKey ? 'today' : ''}">
          <div class="cal-agenda-dow">${g.date.toLocaleDateString("it-IT",{weekday:"short"})}</div>
          <div class="cal-agenda-num">${g.date.getDate()}</div>
          <div class="cal-agenda-mon">${g.date.toLocaleDateString("it-IT",{month:"short"})}</div>
        </div>
        <div class="cal-agenda-events">
          ${g.events.map(ev => renderEventItem(ev, false)).join("")}
        </div>
      </div>`).join("");

  return `<div class="cal-overlay" onclick="if(event.target===this){Calendar.close();render()}">
    <div class="cal-panel">
      <div class="cal-header">
        <div>
          <div class="cal-title-small">📅 Calendario</div>
          <div class="cal-month-label">${c.view === "month" ? `${MESI_IT[c.month]} ${c.year}` : "Agenda"}</div>
        </div>
        <button class="cal-close" onclick="Calendar.close();render()">✕</button>
      </div>

      <div class="cal-view-tabs">
        <button class="cal-view-tab ${c.view==='month'?'on':''}" onclick="Calendar.view='month';renderCalendarOnly()">📅 Mese</button>
        <button class="cal-view-tab ${c.view==='agenda'?'on':''}" onclick="Calendar.view='agenda';renderCalendarOnly()">📋 Agenda</button>
      </div>

      ${c.view === "month" ? monthBody : agendaBody}

      ${c.showForm ? renderEventForm(hourOpts, minOpts) : ''}
    </div>
  </div>`;
}
