  }
  // TIMER (prima di "annulla X" / "cancella X"): ferma / quanto manca
  if (/^(?:annulla|ferma|stop|cancella|togli|spegni|elimina)\s+(?:il\s+|i\s+|tutti\s+i\s+)?timer$/i.test(lower)) return { kind: "timer_cancel" };
  if (/^(?:quanto\s+(?:manca|resta)\s+(?:al|del|sul)\s+timer|a\s+che\s+punto\s+è\s+il\s+timer|(?:quanto\s+)?tempo\s+(?:manca|resta)(?:\s+al\s+timer)?)\s*[?!.]*$/i.test(lower)) return { kind: "timer_status" };
  // "annulla la riunione" → cancella l'evento (con conferma); "annulla l'abbonamento" → è un task
  if ((m = t.match(/^annulla(?:re)?\s+(.+)$/i))) {
    const q = stripArticles(m[1].replace(/^(?:l'\s*)?(?:evento|appuntamento|impegno)\s+/i, "").replace(/^(?:dal|dalla|con)\s+/i, ""));
    if (typeof Calendar !== "undefined" && Calendar.findByTitle(q.toLowerCase())) return { kind: "delete_task", query: q };
    return taskFromText(t, t);
  }

  // "ricordamelo" da solo: manca il quando
  if (/^(?:ricordamel[oaie]|ricordatel[oaie]|ricordami|ricordamene)\s*[!.]*$/i.test(String(rawText || "").trim().replace(/^(?:(?:ehi|ok)\s+)?teto[,\s]+/i, ""))) {
    return { kind: "clarify", original: t };
  }
  // "nota per la lavatrice: X" → nota sul task (prima della lista Note)
  if ((m = t.match(/^(?:aggiungi\s+(?:una\s+)?)?nota\s+(?:per|su|sul|sulla|al|alla|allo|all'|a)\s*(.+?)\s*:\s*(.+)$/i)) && findTaskFuzzy(stripArticles(m[1]))) {
    return { kind: "task_note", query: stripArticles(m[1]), note: m[2].trim() };
  }
  // ─── EXPLICIT PREFIXES (user forces type) ───────────────
  if (/^(?:nota|note|nuova\s+nota|appunt[oi]|appunta(?:mi)?|annota(?:mi)?|prendi\s+nota|memo)\s*(?:che\s+)?[:\s]/i.test(t)) {
    return { kind: "list_add_default", text: t.replace(/^(?:nota|note|nuova\s+nota|appunt[oi]|appunta(?:mi)?|annota(?:mi)?|prendi\s+nota|memo)\s*[:\s]+(?:che\s+)?/i, "").trim() };
  }
  if (/^evento\s*[:\s]|^(?:appuntamento|impegno)\s*:/i.test(t)) {
    return parseEventIntent(t.replace(/^(?:evento|appuntamento|impegno)\s*[:\s]+/i, ""));
  }
  // "metti in calendario X" / "segna in agenda X" / "crea un evento X" / "fissa un appuntamento X"
  if ((m = t.match(/^(?:metti|segna|aggiungi|inserisci|salva|scrivi)\s+(.+?)\s+(?:in|nel|al|sul|nell')\s*(?:calendario|agenda)\b\s*(.*)$/i))) {
    return parseEventIntent((m[1] + " " + m[2]).trim());
  }
  if ((m = t.match(/^(?:metti|segna|aggiungi|inserisci|salva|scrivi)\s+(?:in|nel|al|sul|nell')\s*(?:calendario|agenda)\s+(.+)/i)) ||
      (m = t.match(/^(?:crea|fissa|aggiungi|nuovo|metti|segna|prendi)\s+(?:un\s+|l'\s*|nuovo\s+)?(?:evento|appuntamento|impegno)\s*:?\s+(?:per\s+)?(.+)/i))) {
    return parseEventIntent(m[1]);
  }
  // "svegliami/avvisami tra 20 minuti" → timer
  if ((m = lower.match(/^(?:svegliami|avvisami|chiamami|suona)\s+(?:tra|fra|dopo)\s+(.+)$/i))) {
    const ms = parseDuration(m[1]);
    if (ms && ms > 0 && ms < 24 * 3600 * 1000 && !/\s(?:di|per|che)\s/.test(m[1])) return { kind: "timer", ms, label: formatDuration(ms) };
  }
  if (/^(?:task|compito|cosa\s+da\s+fare|da\s+fare)\s*[:\s](?!\s*(?:scadut|in\s+ritardo|completat|fatt[ie]\b))/i.test(t)) {
    return { kind: "task", text: t.replace(/^(?:task|compito|cosa\s+da\s+fare|da\s+fare)\s*[:\s]+/i, "").trim() };
  }
  if (/^(?:promemoria|ricorda)\s*[:\s]/i.test(t)) {
    const rest = t.replace(/^(?:promemoria|ricorda)\s*[:\s]+/i, "").trim();
    const dt = parseDateTime(rest);
    return { kind: "task", text: dt?.cleaned || rest, reminderAt: dt?.timestamp || null };
  }

  // ─── HELP ───────────────────────────────────────────────
  if (/^(?:aiuto|aiutami|help|come\s+si\s+usa|come\s+ti\s+uso|cosa\s+(?:puoi|sai)\s+fare|comandi|che\s+comandi|come\s+funzioni|istruzioni|guida)(?:\s+teto)?\s*[?!.]*$/i.test(lower) ||
      /^(?:non\s+so\s+(?:cosa|che)\s+dire|cosa\s+ti\s+posso\s+chiedere)\b/i.test(lower)) {
    return { kind: "help" };
  }

  // ─── RESPONSE STYLE ─────────────────────────────────────
  if (/^(?:rispondi|parla|modalit[aà]\s+risposte?)\s+(?:in\s+modo\s+)?(?:breve|corto|sintetico)\b/i.test(lower)) {
    return { kind: "response_style", style: "short" };
  }
  if (/^(?:rispondi|parla|modalit[aà]\s+risposte?)\s+(?:in\s+modo\s+)?(?:normale|standard)\b/i.test(lower)) {
    return { kind: "response_style", style: "normal" };
  }
  if (/^(?:rispondi|parla|modalit[aà]\s+risposte?)\s+(?:in\s+modo\s+)?(?:dettagliato|lungo|esteso)\b/i.test(lower)) {
    return { kind: "response_style", style: "detailed" };
  }

  // ─── NATURAL CORRECTION OF LAST ACTION ──────────────────
  if ((m = lower.match(/^(?:non\s+quello[,.\s]*intendevo|no[,.\s]*intendevo|intendevo)\s+(.+)/i))) {
    return { kind: "correct_last", text: m[1].trim() };
  }

  // ─── LIST ALIAS ─────────────────────────────────────────
  if ((m = lower.match(/^(?:chiama|imposta|usa|considera)\s+(?:la\s+lista\s+)?(.+?)\s+(?:come|=)\s+(.+)/i))) {
    return { kind: "alias_set", canonical: stripArticles(m[1]), alias: stripArticles(m[2]) };
  }
  if ((m = lower.match(/^(?:rimuovi|elimina|cancella)\s+(?:alias)\s+(.+)/i))) {
    return { kind: "alias_remove", alias: stripArticles(m[1]) };
  }

  // ═══ FUNZIONI VOCALI v2 ═══════════════════════════════════
  const rawL = String(rawText || "").trim().toLowerCase().replace(/[’`]/g, "'")
    .replace(/^(?:(?:ehi|hey|ok|ciao)\s+)?tet?to[,.\s!?]+/i, "").replace(/[.!?]+$/, "").trim();

  // 1) Comandi sull'ULTIMO task ("ricordamelo tra un'ora", "mettilo urgente", "cancellalo", "l'ho fatto")
  // "spostalo alle 10" / "rimandalo di un'ora": sposta l'ultimo impegno o task, tenendo il suo giorno se dico solo l'ora
  if (/^(?:spost|rimand|posticip|rinvi|anticip)a(?:l[oaie]|mel[oaie])\s+/.test(rawL)) {
    const mv = parseMoveCommand(rawL);
    const lastIsEvent = state.lastAgendaRef && !state.tasks.some(x => x.id === state.lastAgendaRef) && !state.expanded;
    if (mv && !mv.ref.name && (mv.shiftMs || (mv.time && !mv.dateKey) || (lastIsEvent && (mv.dateKey || mv.time)))) return mv;
  }
  if ((m = rawL.match(/^(?:ricordamel[oaie]|ricordatel[oaie]|rimandal[oaie]|spostal[oaie]|posticipal[oaie]|rinvial[oaie]|mettimel[oaie])\s+(.+)$/i))) {
    const dt = parseDateTime(m[1]);
    if (dt) return { kind: "task_followup", op: "remind", at: dt.timestamp, repeat: dt.repeat || null };
  }
  if ((m = rawL.match(/^(?:mettil[oaie]|segnal[oaie]|spostal[oaie]|fall[oaie])\s+(?:come\s+|in\s+|nel(?:la)?\s+|tra\s+(?:gli|i|le)\s+)?(urgent[ei]|lavoro|personal[ei])$/i))) {
    return { kind: "task_followup", op: "category", category: /^urg/.test(m[1]) ? "urgente" : /^lav/.test(m[1]) ? "lavoro" : "personale" };
  }
  if (/^(?:cancellal[oaie]|eliminal[oaie]|toglil[oaie]|levall[oaie]|buttal[oaie](?:\s+via)?)$/i.test(rawL)) return { kind: "task_followup", op: "delete" };
  if (/^(?:l'?\s*ho\s+(?:già\s+)?(?:fatt[oa]|finit[oa]|completat[oa])|fatto\s+(?:quello|questo)|completal[oa]|segnal[oa]\s+(?:come\s+)?(?:fatt[oa]|finit[oa]))$/i.test(rawL)) return { kind: "task_followup", op: "complete" };
  if ((m = String(rawText || "").trim().match(/^(?:(?:ehi\s+|ok\s+)?teto[,\s]+)?(?:aggiungici|aggiungigli|scrivici|mettici)\s+(?:(?:una|la|come)\s+)?(?:nota\s*[:,]?\s*)?(.+)$/i))) {
    return { kind: "task_followup", op: "note", note: m[1].replace(/[.!]+$/, "").trim() };
  }
  if ((m = String(rawText || "").trim().match(/^(?:(?:ehi\s+|ok\s+)?teto[,\s]+)?(?:cambial[oa]|rinominal[oa]|chiamal[oa]|correggil[oa])\s+(?:in\s+|con\s+)?(.+)$/i))) {
    return { kind: "task_followup", op: "rename", text: m[1].replace(/[.!]+$/, "").trim() };
  }

  // 2) Scaduti / 3) rimanda in blocco / 4) prossima cosa
  if (/^(?:cosa|che\s+cosa|che)\s+(?:ho\s+dimenticato|mi\s+sono\s+(?:dimenticat[oa]|pers[oa])|è\s+scaduto|ho\s+(?:in\s+)?(?:ritardo|arretrato|lasciato\s+indietro)|è\s+rimasto\s+indietro)|^(?:quali|quanti)\s+(?:task|promemoria|cose)\s+(?:sono\s+)?(?:scadut[ie]|in\s+ritardo)|^(?:task|promemoria|cose)\s+scadut[ie]$|^ho\s+dimenticato\s+qualcosa$/i.test(lower)) {
    return { kind: "overdue_list" };
  }
  if ((m = lower.match(/^(?:rimanda|sposta|posticipa|rinvia)\s+(?:tutt[oie]|tutti\s+i\s+(?:task|promemoria)|gli\s+scaduti|le\s+cose\s+scadute|i\s+task\s+scaduti|quello\s+che\s+(?:non\s+ho\s+fatto|è\s+scaduto)|tutto\s+quello\s+che\s+(?:non\s+ho\s+fatto|è\s+scaduto)|i\s+task\s+di\s+oggi|le\s+cose\s+di\s+oggi)(?:\s+(?:a|ad|al|per))?\s*(.*)$/i))) {
    const scope = /oggi/.test(m[0]) ? "today" : "overdue";
    const dt = m[1] ? parseDateTime(m[1]) : null;
    return { kind: "bulk_reschedule", scope, at: dt ? dt.timestamp : null };
  }
  if (/^(?:cosa|che\s+cosa|che)\s+(?:faccio|devo\s+fare)\s+(?:adesso|ora|per\s+prima|subito|come\s+prima\s+cosa)|^(?:qual\s*(?:è|e)\s+)?(?:la\s+)?prossima\s+cosa(?:\s+da\s+fare)?$|^(?:qual\s*(?:è|e)\s+)?(?:il\s+)?prossimo\s+(?:task|impegno|promemoria|appuntamento)$|^cosa\s+c'?\s*è\s+dopo$|^da\s+dove\s+(?:comincio|inizio|parto)$|^(?:su\s+)?cosa\s+mi\s+concentro$/i.test(lower)) {
    return { kind: "next_up" };
  }

  // 5) Dove ho messo le cose / parcheggio
  if ((m = lower.match(/^(?:dov'\s*è|dov'\s*e|dove\s+(?:ho\s+(?:messo|lasciato|parcheggiato|nascosto|posato)|sono|è|stanno|sta|avevo\s+messo))\s*(.*?)\s*[?!.]*$/i))) {
    const what = /parcheggiato/.test(m[0]) && !m[1] ? "la macchina" : (m[1] || "").trim();
    if (/^(?:casa(?:\s+mia)?|abito|sei)$/i.test(what)) return { kind: "geofence_show_home" };
    if (what) return { kind: "place_get", item: what };
  }
  if ((m = t.match(/^((?:il|lo|la|l'|i|gli|le|mio|mia|miei|mie)\s*\S.*?)\s+(?:è|sono|sta|stanno)\s+((?:sotto|sopra|dietro|dentro|davanti|accanto|vicino|nel|nella|nello|nei|nelle|sul|sulla|sullo|sui|sulle|in\s+(?:macchina|camera|cucina|bagno|salotto|borsa|tasca|ufficio|garage|cantina)|a\s+casa\s+(?:di|della|del)|da)\b.+)$/i)) && !/^(?:il|la|lo)\s+(?:task|evento|dentista|riunione)/i.test(m[1])) {
    return { kind: "place_set", item: m[1].trim(), place: m[2].trim() };
  }
  if ((m = t.match(/^(?:ho\s+)?parcheggiato\s+(?:la\s+macchina\s+|l'auto\s+|la\s+moto\s+|lo\s+scooter\s+)?((?:in|al|alla|a|nel|nella|sul|sulla|vicino|davanti|dietro|sotto|accanto|fuori)\b.+)$/i))) {
    return { kind: "place_set", item: /moto|scooter/i.test(m[0]) ? "la moto" : "la macchina", place: m[1].trim() };
  }
  if ((m = t.match(/^(?:ho\s+(?:messo|lasciato|nascosto|posato|riposto|conservato)|(?:le|la|il|lo|i|gli)\s+\S+\s+(?:sono|è|stanno|sta)|metto)\s+(.+?)\s+((?:in|nel|nella|nello|nei|nelle|sul|sulla|sullo|sui|sulle|sotto|sopra|dietro|dentro|davanti|accanto|vicino|fra|tra|da|dal|dalla|a\s+casa|in\s+macchina)\b.*)$/i)) && !/^(?:il|la|lo)?\s*(?:lavatrice|lavastoviglie|asciugatrice)/i.test(m[1])) {
    const ln = Lists.findByName(normalizeListRef(stripArticles(m[2].replace(/^(?:nella|nel|in|sulla|sul)\s+(?:lista\s+(?:della\s+)?)?/i, ""))));
    if (!ln) return { kind: "place_set", item: m[1].trim(), place: m[2].trim() };
    const items = splitListItems(m[1]);
    return { kind: "list_add", items, item: items.join(", "), listName: ln.name };
  }

  // 6) Modificare un task per nome
  if ((m = t.match(/^(?:aggiungi|metti|scrivi)\s+(?:una\s+|la\s+)?nota\s+(?:a|al|alla|allo|all'|ai|agli|alle|per|su|sul|sulla)\s*(.+?)\s*[:,]\s*(.+)$/i)) ||
      (m = t.match(/^nota\s+(?:per|su|sul|sulla|al|alla|a)\s+(.+?)\s*[:,]\s*(.+)$/i))) {
    return { kind: "task_note", query: stripArticles(m[1]), note: m[2].trim() };
  }
  if ((m = t.match(/^(?:rinomina|cambia(?:\s+(?:il\s+)?(?:nome\s+(?:di|del|della|a)|testo\s+(?:di|del|della)|task))?|correggi)\s+(.+?)\s+(?:in|con)\s+(.+)$/i)) && !/\s(?:nella|dalla|della|sulla)\s+(?:lista\s+)?\S+$/i.test(t)) {
    if (findTaskFuzzy(stripArticles(m[1]))) return { kind: "task_rename", query: stripArticles(m[1]), text: m[2].trim() };
  }
  if ((m = lower.match(/^(?:metti|sposta|segna|imposta)\s+(.+?)\s+(?:come\s+|in\s+|nel(?:la)?\s+|tra\s+(?:gli|i|le)\s+)?(urgent[ei]|lavoro|personal[ei])$/i)) ||
      (m = lower.match(/^(.+?)\s+è\s+(urgente|di\s+lavoro|personale)$/i))) {
    const q = stripArticles(m[1]);
    if (findTaskFuzzy(q)) return { kind: "task_category", query: q, category: /urg/.test(m[2]) ? "urgente" : /lav/.test(m[2]) ? "lavoro" : "personale" };
  }

  // 7) In blocco: pulisci completati / completa tutto
  if (/^(?:cancella|elimina|togli|pulisci|rimuovi|svuota)\s+(?:(?:tutt[ie]\s+)?(?:i\s+task\s+|le\s+cose\s+|i\s+promemoria\s+|i\s+|le\s+)?(?:completat[ie]|fatt[ie]|finit[ie]))(?:\s+task)?$/i.test(lower)) {
    return { kind: "delete_done" };
  }
  if ((m = lower.match(/^(?:segna|completa|spunta)\s+tutt[oie](?:\s+i\s+task)?(?:\s+(?:di|del|della)\s+(lavoro|urgenti|personali|oggi))?(?:\s+come\s+fatt[oie])?$/i)) ||
      (m = lower.match(/^(?:ho\s+fatto\s+tutto)(?:\s+(?:di|per)\s+(oggi|lavoro))?$/i))) {
    const c = m[1] || "";
    return { kind: "complete_all", category: /lavor/.test(c) ? "lavoro" : /urgent/.test(c) ? "urgente" : /personal/.test(c) ? "personale" : null, todayOnly: /oggi/.test(c) };
  }

  // 8) Interruttori
  if (/^(?:silenzio|stai\s+zitt[ao]|non\s+parlare(?:\s+più)?|voce\s+off|disattiva\s+(?:la\s+)?voce|togli\s+(?:la\s+)?voce|spegni\s+(?:la\s+)?voce|muta|modalità\s+silenziosa|parla\s+di\s+meno)$/i.test(lower)) return { kind: "tts_set", on: false };
  if (/^(?:parla|voce\s+on|attiva\s+(?:la\s+)?voce|riattiva\s+(?:la\s+)?voce|accendi\s+(?:la\s+)?voce|puoi\s+parlare|rispondimi\s+a\s+voce|leggi\s+ad\s+alta\s+voce)$/i.test(lower)) return { kind: "tts_set", on: true };
  if ((m = lower.match(/^(?:(?:attiva|metti|imposta|passa\s+al?)\s+)?(?:il\s+|la\s+)?(?:tema|modalità)\s+(scur[oa]|chiar[oa]|notte|giorno|automatic[oa]|auto)$|^(dark|light)\s+mode$/i))) {
    const v = (m[1] || m[2]).toLowerCase();
    return { kind: "theme_set", mode: /scur|notte|dark/.test(v) ? "dark" : /chiar|giorno|light/.test(v) ? "light" : "auto" };
  }
  if ((m = lower.match(/^(?:mostra(?:mi)?|fammi\s+vedere|filtra)\s+(?:solo\s+)?(?:i\s+task\s+|le\s+cose\s+)?(?:gli\s+|i\s+|le\s+|il\s+)?(urgent[ie]|(?:di\s+)?lavoro|personal[ie]|tutt[oie](?:\s+i\s+task)?|completat[ie]|fatt[ie])$/i))) {
    const v = m[1];
    if (/complet|fatt/.test(v)) return { kind: "filter_set", filter: "all", showDone: true };
    return { kind: "filter_set", filter: /urgent/.test(v) ? "urgente" : /lavoro/.test(v) ? "lavoro" : /personal/.test(v) ? "personale" : "all" };
  }
  if (/^(?:(?:avvia|fai\s+partire|inizia|comincia|metti|parti\s+con)\s+(?:un\s+|il\s+)?(?:pomodoro|sessione\s+pomodoro)|timer\s+pomodoro|modalità\s+pomodoro|sessione\s+di\s+studio|25\s+minuti\s+di\s+(?:studio|lavoro|concentrazione))$/i.test(lower)) {
    return { kind: "timer", ms: 25 * 60000, label: "25 minuti 🍅" };
  }

  // 9) Ripeti
  if (/^(?:ripeti|ripetere|ripetilo|ripetimelo|puoi\s+ripetere|cosa\s+hai\s+detto|come\s+hai\s+detto|non\s+ho\s+(?:capito|sentito)|scusa\s+non\s+ho\s+capito|eh\??)$/i.test(lower)) return { kind: "repeat_last" };

  // ─── BRIEFING (#4) ──────────────────────────────────────
  if (/^(?:com'?\s*è|come\s+(?:è|sarà|va))\s+(?:la\s+)?(?:mia\s+)?giornata\b/i.test(lower)) return { kind: "briefing" };
  if (/^(?:che\s+giorno\s+è(?:\s+oggi)?|che\s+giorno\s+è\s+domani|oggi\s+che\s+giorno\s+è|che\s+data\s+è(?:\s+oggi)?)\s*[?!.]*$/i.test(lower)) return { kind: "date_info" };
  if (/^(?:cosa|che\s+cosa|che)\s+c'?\s*è\s+(?:in|nel|sul|nell')\s*(?:agenda|programma|calendario)\b/i.test(lower)) {
    const tail = lower.replace(/^(?:cosa|che\s+cosa|che)\s+c'?\s*è\s+(?:in|nel|sul|nell')\s*(?:agenda|programma|calendario)\s*/i, "").replace(/[?!.]+$/, "");
    if (/^(?:(?:nel|questo|il|per\s+il|a)\s+)?(?:weekend|week\s*end|fine\s*settimana)$/i.test(tail)) return { kind: "summary", when: "weekend" };
    const wd = tail && !/^(?:oggi|stasera|domani|questa\s+settimana|settimana)$/.test(tail) ? parseWhenOnly(tail.replace(/^per\s+/, "")) : null;
    if (wd && wd.dayKey) return { kind: "summary", when: "giorno", dayKey: wd.dayKey };
    const w = lower.match(/\b(oggi|stasera|domani|questa\s+settimana|settimana)\b/);
    return { kind: "summary", when: w ? (w[1] === "settimana" ? "questa settimana" : w[1]) : "oggi" };
  }
  if (/^(?:briefing|riepilogo\s+mattutino|fammi\s+il\s+briefing|come\s+(?:è|e)\s+oggi|come\s+sarà\s+oggi|come\s+procede\s+oggi|sintesi\s+(?:della\s+)?giornata)\b/i.test(lower)) {
    return { kind: "briefing" };
  }

  // ─── SMART PLAN (#1) ────────────────────────────────────
  if (/^(?:(?:pianifica|organizza|programma)(?:mi|temi|rmi)?(?:\s+(?:la\s+(?:mia\s+)?giornata|la\s+giornata\s+di\s+oggi|oggi|la\s+mia\s+giornata))?|fammi\s+(?:un\s+)?piano(?:\s+per\s+oggi)?|piano\s+(?:per\s+)?oggi|cosa\s+faccio\s+oggi)\s*[?!.]*$/i.test(lower)) {
    return { kind: "plan_day" };
  }

  // ─── PREFERENCES: REMEMBER (#6) ─────────────────────────
  // "memorizza casa" deve impostare la posizione di casa, non un ricordo generico
  if (/^(?:memorizza|salva|ricorda(?:ti)?)\s+(?:la\s+)?(?:mia\s+)?(?:casa|posizione\s+di\s+casa)[.!]*$/i.test(lower)) {
    return { kind: "geofence_save_home" };
  }
  // "ricordati che X", "memorizza X", "tieni a mente che X"
  if ((m = lower.match(/^(?:ricordati\s+(?:di\s+me\s+che|di\s+me|che)|memorizza(?:\s+che)?|tieni(?:mi)?\s+a\s+mente(?:\s+che)?|sappi\s+che)\s+(.+)/i))) {
    return { kind: "pref_set", text: m[1].trim() };
  }

  // ─── PREFERENCES: FORGET (#6) ───────────────────────────
  if (/^(?:dimentica(?:ti)?\s+(?:tutto(?:\s+di\s+me)?|di\s+me)|scordati\s+di\s+me|cancella\s+(?:tutta\s+la\s+)?(?:tua\s+)?memoria|svuota\s+(?:la\s+)?memoria)\s*[?!.]*$/i.test(lower)) {
    return { kind: "pref_clear" };
  }
  if ((m = lower.match(/^(?:dimentica(?:ti)?(?:\s+(?:che|di))?|scorda(?:ti)?(?:\s+(?:che|di))?|cancella\s+(?:dalla\s+memoria|il\s+ricordo|che))\s+(.+)/i))) {
    return { kind: "pref_remove", text: m[1].trim() };
  }
  if (/^(?:dimentica\s+tutto|cancella\s+(?:tutta\s+la\s+)?memoria|svuota\s+(?:la\s+)?memoria)\b/i.test(lower)) {
    return { kind: "pref_clear" };
  }

  // ─── PREFERENCES: LIST (#6) ─────────────────────────────
  if (/^(?:ti\s+)?ricord(?:ati|i|a)\s+di\s+me\s*[?!.]*$/i.test(lower)) return { kind: "pref_list" };
  if (/^(?:cosa\s+(?:ricordi|sai)\s+(?:di\s+me)?|cosa\s+ti\s+ricordi|che\s+(?:cosa\s+)?(?:ricordi|sai)\s+di\s+me|mostra(?:mi)?\s+(?:la\s+)?memoria|le\s+tue\s+memorie|memoria)\b/i.test(lower)) {
    return { kind: "pref_list" };
  }

  // ─── FOCUS MODE (#7) ────────────────────────────────────
  if (/^(?:focus|focus\s+mode)\s*[?!.]*$/i.test(lower) || /^(?:modalità\s+focus|attiva\s+(?:il\s+)?focus|modalità\s+(?:notte|notturna|riposo|silenziosa)|spegni\s+tutto|schermo\s+(?:blocco|spento|nero)|lock\s+screen)\b/i.test(lower)) {
    return { kind: "focus_enter" };
  }
  if (/^(?:esci\s+(?:dal\s+)?focus|chiudi\s+(?:il\s+)?focus|riaccendi)\b/i.test(lower)) {
    return { kind: "focus_exit" };
  }

  // ─── SMART REMINDER: GEOFENCE (#3) ──────────────────────
  // "ricordami X quando esco di casa" / "ricordami quando arrivo a casa di Y"
  if ((m = lower.match(/^(?:ricord(?:a(?:mi|temi)|ati)|fammi\s+ricordare|promemoria(?:\s+per\s+me)?)\s+(?:di\s+)?(.+?)\s+quando\s+(esco\s+di\s+casa|arrivo\s+a\s+casa|sono\s+a\s+casa|torno\s+a\s+casa)\b/i))) {
    const trigger = /esco/.test(m[2]) ? "leave_home" : "arrive_home";
    return { kind: "geofence_set", text: m[1].trim(), trigger };
  }
  // "memorizza casa" / "questa è casa mia" → set home location
  if (/^(?:memorizza\s+(?:la\s+)?(?:posizione|posto)|questa\s+è\s+casa(?:\s+mia)?|sono\s+a\s+casa\s+adesso|salva\s+(?:la\s+)?(?:mia\s+)?posizione|ricordati\s+casa)\b/i.test(lower)) {
    return { kind: "geofence_save_home" };
  }
  // "dove sei?" / "dove abito?" — useful debug
  if (/^(?:dove\s+(?:sei|abito|sono)|qual'?\s*è\s+casa\s+mia|che\s+casa\s+ho)\b/i.test(lower)) {
    return { kind: "geofence_show_home" };
  }

  // ─── SMART REMINDER: NEXT FREE DAY (#3) ─────────────────
  // "ricordami X al prossimo giorno libero"
  if ((m = lower.match(/^(?:ricord(?:a(?:mi|temi)|ati)|fammi\s+ricordare)\s+(?:di\s+)?(.+?)\s+(?:al|nel|il)\s+prossimo\s+(?:giorno\s+)?liber[oe]\b/i))) {
    return { kind: "task_next_free", text: m[1].trim() };
  }

  // ─── SMART REMINDER: TIMER → TASK BRIDGE (#3) ───────────
  // "fra/tra X di Y ricordami Z" / "ricordami Z fra/tra X"
  // Only matches if duration is short-ish (< 24h) so dt-parser handles longer forms.
  if ((m = t.match(/^(?:ricord(?:a(?:mi|temi)|ati)|fammi\s+ricordare|promemoria(?:\s+per\s+me)?)\s+(?:di\s+)?(.+?)\s+(?:tra|fra|in|dopo)\s+(.+)/i))) {
    const dur = parseDuration(m[2]);
    if (dur && dur > 0 && dur < 24 * 3600 * 1000) {
      return { kind: "task", text: m[1].trim(), reminderAt: Date.now() + dur };
    }
  }
  // Inverted: "tra X ricordami di Y"
  if ((m = t.match(/^(?:tra|fra|in|dopo)\s+(.+?)\s+(?:ricord(?:a(?:mi|temi)|ati)|fammi\s+ricordare)\s+(?:di\s+)?(.+)/i))) {
    const dur = parseDuration(m[1]);
    if (dur && dur > 0 && dur < 24 * 3600 * 1000) {
      return { kind: "task", text: m[2].trim(), reminderAt: Date.now() + dur };
    }
  }

  // "cancella tutti gli impegni di sabato", "libera la giornata di domani"
  if ((m = lower.match(/^(?:cancella(?:mi)?|elimina(?:mi)?|togli(?:mi)?|svuota|libera(?:mi)?)\s+(?:tutt[oi]\s+(?:gli\s+impegni|gli\s+appuntamenti|gli\s+eventi|quello\s+che\s+ho)|tutto|l'agenda|la\s+giornata|l'intera\s+giornata)?\s*(?:di|del|della|per|che\s+ho)?\s*(.+?)\s*[?!.]*$/i)) && /tutt|agenda|giornata|^libera/.test(lower.split(/\s+/).slice(0, 3).join(" "))) {
    const w = parseWhenOnly(m[1]);
    if (w && w.dayKey) return { kind: "agenda_clear_day", dayKey: w.dayKey };
  }
  // ─── CALENDAR: DELETE EVENT (V2) ──────────────────────
  // "cancella/elimina evento X" / "rimuovi X dal calendario"
  if ((m = lower.match(/^(?:cancella(?:mi)?|elimina(?:mi)?|togli(?:mi)?|rimuovi|disdici|annulla)\s+((?:l['’]?\s*|il\s+|un\s+|quell[oa]\s+|quel\s+)?(?:(?:evento|appuntamento|impegno|promemoria)\s+)?(?:di|del|della|dell['’]|delle|per)\s+.+)$/i)) && (() => { const r = parseAgendaRef(m[1]); return !r.name && (r.dayKey || r.time); })()) {
    return { kind: "event_delete", query: m[1].trim() };
  }
  if ((m = lower.match(/^(?:cancella|elimina|togli|rimuovi|disdici)\s+(?:l['’]?\s*|il\s+|un\s+)?(?:evento|appuntamento|impegno)\s+(?:(?:dal|dalla|dallo|con|di|del)\s+)?(.+)/i)) ||
      (m = lower.match(/^(?:cancella|elimina|togli|rimuovi)\s+(.+?)\s+dal\s+calendario\b/i))) {
    return { kind: "event_delete", query: m[1].trim() };
  }

  // ─── CALENDAR/TASK: MOVE ("sposta l'impegno di sabato alle 16", "posticipa la cena di un'ora") ──
  if ((m = parseMoveCommand(lower))) return m;

  // ─── FESTIVITÀ: "quando è Natale" (prima della ricerca negli eventi) ──
  if ((m = lower.match(/^(?:quando\s+(?:è|c'?\s*è|cade|arriva)|quanto\s+manca(?:no)?\s+(?:(?:alla|al|a)\s+|all'))\s*(.+?)[?!.]*$/i)) && findHoliday(m[1]) && !Calendar.findByTitle(stripArticles(m[1]))) {
    return { kind: "countdown", holiday: m[1].trim() };
  }
  // ─── CALENDAR: QUERY EVENT (V3) ───────────────────────
  // "quando ho X?" / "che giorno è X?" / "a che ora è X"
  if ((m = lower.match(/^(?:quando\s+(?:ho|c['’]?\s*è|è)|che\s+giorno\s+(?:è|cade)|a\s+che\s+ora\s+(?:è|c['’]?\s*è|ho))\s+(?:l['’]?\s*evento\s+)?(.+?)[?!.]*$/i))) {
    return { kind: "event_query", query: stripArticles(m[1].trim()) };
  }

  // ─── LIST: CREATE ───────────────────────────────────────
  // "crea(mi) (una) lista X" / "nuova lista X" / "fai(mi) una lista X" / "voglio una lista X"
  if ((m = t.match(/^(?:crea(?:re|mi|temi|rmi)?|fai(?:re|mi|temi)?|fammi|fare|creo|voglio|vorrei|aggiungi|aggiungimi|aggiungere|aggiungermi|prepara(?:mi)?|apri(?:mi)?\s+una)\s+(?:una\s+|un'\s*|la\s+|il\s+)?(?:nuova\s+)?lista\s+(?:(?:chiamata|di\s+nome|per\s+il|per\s+la|per|della|del|dei|delle)\s+)?(.+)/i))) {
    return { kind: "list_create", name: stripArticles(m[1]) };
  }
  if ((m = t.match(/^nuova\s+lista\s+(.+)/i))) {
    return { kind: "list_create", name: stripArticles(m[1]) };
  }

  // ─── LIST: DELETE ────────────────────────────────────────
  // "cancella lista X" / "elimina la lista X" — check BEFORE delete_task
  if ((m = lower.match(/^(?:cancella(?:mi|re)?|elimina(?:mi|re)?|rimuovi|rimuovere|togli|togliere|distruggi)\s+(?:la\s+)?lista\s+(.+)/i))) {
    return { kind: "list_delete", name: stripArticles(m[1]) };
  }

  // ─── LIST: REMOVE ITEM ("togli il latte dalla spesa") ────
  if ((m = t.match(/^(?:togli(?:ere)?|rimuovi|rimuovere|leva(?:re)?|cancella(?:re)?|elimina(?:re)?|butta\s+via)\s+(.+?)\s+(?:dalla|dal|dalle|dai|dagli|dallo)\s+(?:lista\s+(?:della\s+|dei\s+|del\s+|delle\s+)?)?(.+)$/i))) {
    const ln = normalizeListRef(stripArticles(m[2]));
    if (/^tutt[oie](?:\s+(?:le\s+voci|quanto))?$/i.test(m[1].trim())) return { kind: "list_clear", name: ln };
    if (Lists.findByName(ln)) return { kind: "list_remove", items: splitListItems(m[1]), item: stripArticles(m[1]), listName: ln };
  }

  // ─── LIST: CHECK ITEM (V-2) ──────────────────────────────
  // "spunta/segna X dalla/nella lista Y" / "spunta X" (one list match)
  if ((m = t.match(/^(?:spunta|segna(?:re)?\s+come\s+(?:fatt|pres|comprat)[oaie]|completa(?:re)?|fatto)\s+(.+?)\s+(?:dalla|nella|nelle|della|dalle|sulla|in|dal)\s+(?:lista\s+)?(.+)/i))) {
    return { kind: "list_check", item: stripArticles(m[1].trim()), listName: stripArticles(m[2]) };
  }
  // "ho preso il latte" / "preso il latte" / "comprato il pane" / "spunta latte" → voce di una lista
  if ((m = t.match(/^(?:ho\s+(?:già\s+)?(?:preso|comprato|trovato|visto|letto|messo)|pres[oi]|comprat[oi]|spunta)\s+(.+)$/i))) {
    const hit = findListItemFuzzy(stripArticles(m[1]));
    if (hit && hit.list.checkable !== false) return { kind: "list_check", item: hit.item.text, listName: hit.list.name };
  }

  // ─── LIST: EDIT ITEM (V-1) ───────────────────────────────
  // "modifica X in Y nella lista Z" / "cambia X con Y nella lista Z"
  if ((m = lower.match(/^(?:modifica(?:re)?|cambia(?:re)?|sostituis(?:ci|cire))\s+(.+?)\s+(?:in|con)\s+(.+?)\s+(?:nella|dalla|della|sulla)\s+(?:lista\s+)?(.+)/i))) {
    return { kind: "list_edit", oldText: m[1].trim(), newText: m[2].trim(), listName: stripArticles(m[3]) };
  }

  // ─── LIST: CLEAR (V-3) ───────────────────────────────────
  // "svuota la lista X" / "cancella tutte le voci della lista X"
  if ((m = lower.match(/^(?:svuota(?:re)?|pulis(?:ci|cire))\s+(?:la\s+)?lista\s+(.+)/i))) {
    return { kind: "list_clear", name: stripArticles(m[1]) };
  }
  if ((m = lower.match(/^(?:cancella|togli|elimina|rimuovi|leva)\s+tutt[oie](?:\s+(?:le\s+voci|quanto))?\s+(?:dalla|dal|dai|dalle)\s+(?:lista\s+(?:della\s+|dei\s+|del\s+)?)?(.+)$/i))) {
    return { kind: "list_clear", name: normalizeListRef(stripArticles(m[1])) };
  }
  if ((m = lower.match(/^(?:svuota(?:re)?|azzera)\s+(.+)$/i)) && Lists.findByName(normalizeListRef(stripArticles(m[1])))) {
    return { kind: "list_clear", name: normalizeListRef(stripArticles(m[1])) };
  }
  if ((m = lower.match(/^cancella(?:re)?\s+(?:tutt[ie]\s+(?:le\s+)?voci\s+)?(?:della|dalla)\s+(?:lista\s+)?(.+)/i))) {
    return { kind: "list_clear", name: stripArticles(m[1]) };
  }

  // ─── LIST: COUNT (V-4) ───────────────────────────────────
  // "quante voci ho nella/sulla lista X" / "quanto è lunga la lista X"
  if ((m = lower.match(/^(?:quante\s+voci|quante\s+cose|quanti\s+element[ie]|quanti\s+prodotti|quanto\s+è\s+lunga)\s+(?:ho\s+|ci\s+sono\s+|abbiamo\s+|restano\s+)?(?:nella|della|sulla|in|sul|nel)\s+(?:lista\s+)?(.+?)[?!.]*$/i))) {
    return { kind: "list_count", name: stripArticles(m[1]) };
  }

  // ─── LIST: SHARE (V-5) ───────────────────────────────────
  // "condividi/manda/invia (la) lista X (a Y)" / "esporta lista X"
  if ((m = lower.match(/^(?:condividi(?:mi)?|manda(?:mi)?|invia(?:mi)?|esporta|copia)\s+(?:la\s+)?lista\s+(.+?)(?:\s+a\s+.+)?[?!.]*$/i))) {
    return { kind: "list_share", name: stripArticles(m[1]) };
  }

  // ─── LIST: ADD ───────────────────────────────────────────
  // "aggiungi X alla/nella lista Y"
  const LADD = "(?:aggiung(?:i|imi|ere|ermi|iamo)|(?:ri)?mett(?:i|imi|ere|ermi|iamo)|inseris(?:ci|cere|cimi|cermi)|salva(?:re|mi|rmi)?|scriv(?:i|ere|imi|ermi)|segna(?:re|mi|rmi)?|annota(?:re|mi|rmi)?|appunta(?:re|mi|rmi)?)";
  const mkAdd = (itemsStr, listName) => { const items = splitListItems(itemsStr); return { kind: "list_add", items, item: items.join(", "), listName }; };
  if ((m = t.match(new RegExp(`^${LADD}\\s+(.+?)\\s+(?:alla|nella|in|sulla|sul|nel|al)\\s+lista\\s+(?:della\\s+|dei\\s+|del\\s+|delle\\s+|degli\\s+|di\\s+)?(.+)`, "i")))) {
    return mkAdd(m[1], stripArticles(m[2]));
  }
  // "metti nella spesa latte e biscotti" / "aggiungi alla lista spesa: latte" — nome lista riconosciuto per prefisso
  if ((m = t.match(new RegExp(`^${LADD}\\s+(?:alla|nella|al|nel|in|a|sulla|sul)\\s+(?:lista\\s+(?:della\\s+|dei\\s+|del\\s+|delle\\s+)?)?(.+)$`, "i")))) {
    const rest = m[1];
    const byLen = [...Lists.lists].sort((a, b) => b.name.length - a.name.length);
    const hit = byLen.find(l => rest.toLowerCase().startsWith(l.name.toLowerCase() + " ") || rest.toLowerCase().startsWith(l.name.toLowerCase() + ":"));
    if (hit) return mkAdd(rest.slice(hit.name.length).replace(/^[\s:,]+/, ""), hit.name);
  }
  // "alla spesa aggiungi il caffè"
  if ((m = t.match(new RegExp(`^(?:alla|nella|sulla|in|al|nel)\\s+(?:lista\\s+(?:della\\s+)?)?(.+?)\\s+${LADD}\\s+(.+)$`, "i")))) {
    const ln = normalizeListRef(stripArticles(m[1]));
    if (Lists.findByName(ln)) return mkAdd(m[2], ln);
  }
  // "spesa: pomodori, zucchine"
  if ((m = t.match(/^([^:]{2,30}):\s*(.+)$/))) {
    const ln = normalizeListRef(stripArticles(m[1]));
    const l = Lists.findByName(ln);
    if (l && ln.toLowerCase() === l.name.toLowerCase()) return mkAdd(m[2], l.name);
  }
  // "aggiungi X a/alla/al Y" (no "lista" word) — route to list_add if Y matches a known list
  if ((m = t.match(/^(?:aggiung(?:i|imi|ere|ermi)|(?:ri)?mett(?:i|imi|ere|ermi)|inseris(?:ci|cere|cimi)|scriv(?:i|ere|imi|ermi)|segna(?:mi)?|annota(?:mi)?)\s+(.+?)\s+(?:alla|nella|sulla|al|nel|sul|a|in|su|ai|agli|alle|nei|negli|nelle|sui|sugli|sulle)\s+(.+)/i))) {
    const candidate = normalizeListRef(stripArticles(m[2]));
    const commonList = /^(?:spesa|lista\s+della\s+spesa|film|serie(?:\s+tv)?|libri|regali|compiti|valigia|viaggio|ricette|canzoni|musica|idee|cose\s+da\s+comprare)$/i.test(candidate);
    if (Lists.findByName(candidate) || commonList) {
      const items = splitListItems(m[1]);
      return { kind: "list_add", items, item: items.join(", "), listName: candidate };
    }
  }
  // "aggiungi alla lista Y: X" or "aggiungi alla spesa X"


  // ─── LIST: READ ──────────────────────────────────────────
  if (/^(?:cosa|che\s+cosa|che)\s+(?:devo|dobbiamo|c'?\s*è\s+da)\s+comprare|^cosa\s+manca(?:\s+a\s+casa)?\s*[?!.]*$|^(?:la\s+)?lista\s+della\s+spesa\s*[?!.]*$/i.test(lower)) {
    const sl = shoppingList();
    if (sl) return { kind: "list_read", name: sl.name };
  }
  // "mostra(mi)/apri/leggi(mi)/fammi vedere (la) lista X"
  if ((m = lower.match(/^(?:mostra(?:mi)?|apri(?:mi)?|leggi(?:mi)?|fammi\s+vedere|vedi|vedere|dammi|dimmi)\s+(?:la\s+)?lista\s+(.+)/i))) {
    return { kind: "list_read", name: stripArticles(m[1]) };
  }
  if ((m = lower.match(/^(?:cosa|che\s+cosa|che)\s+c'?(?:è|e)\s+(?:nella|sulla|in|sul|nel)\s+(?:lista\s+)?(.+)/i))) {
    if (/^(?:weekend|week\s*end|fine\s*settimana)$/i.test(stripArticles(m[1])) && !Lists.findByName(stripArticles(m[1]))) return { kind: "summary", when: "weekend" };
    return { kind: "list_read", name: stripArticles(m[1]) };
  }
  // "apri la spesa" / "mostra la spesa" — only if it matches a known list
  if ((m = lower.match(/^(?:mostra(?:mi)?|apri(?:mi)?|leggi(?:mi)?|fammi\s+vedere|dimmi)\s+(.+)/i))) {
    const candidate = normalizeListRef(stripArticles(m[1]));
    if (Lists.findByName(candidate)) {
      return { kind: "list_read", name: candidate };
    }
  }

  // ─── TASK: COMPLETE ──────────────────────────────────────
  if ((m = t.match(/^(?:segna|marca|metti)\s+(.+?)\s+come\s+(?:pres|comprat|vist|lett)[oaie]\s*[!.]*$/i))) {
    const hit = findListItemFuzzy(stripArticles(m[1]));
    if (hit) return { kind: "list_check", item: hit.item.text, listName: hit.list.name };
    return { kind: "complete_task", query: stripArticles(m[1]) };
  }
  if (!parseDateTime(t) && (m = t.match(/^(?:ho|abbiamo)\s+(?:già\s+|appena\s+)?(\p{L}+(?:at[oaie]|ut[oaie]|it[oaie]|tt[oaie]|st[oaie]|s[oaie]|rt[oaie]))\s+(.+)$/iu)) &&
      !/^(?:fatto|finito|completato|concluso|ultimato)$/i.test(m[1])) {
    const q = m[1] + " " + m[2];
    const hit = findListItemFuzzy(stripArticles(m[2]));
    if (hit && /^(?:pres|comprat|trovat|mess)/i.test(m[1])) return { kind: "list_check", item: hit.item.text, listName: hit.list.name };
    return { kind: "complete_task", query: q.trim() };
  }
  // "ho fatto X" / "ho finito X" / "ho completato X" / "fatto X" / "finito X" / "completa X" / "segna (come) fatto X"
  if ((m = lower.match(/^(?:ho\s+(?:fatto|finito|completato|concluso|ultimato))\s+(.+)/i)) ||
      (m = lower.match(/^(?:fatto|finito|completato|completata|completare|completa(?:mi)?)\s+(.+)/i)) ||
      (m = lower.match(/^(?:segna(?:mi|re)?|marca(?:mi|re)?|spunta)\s+(?:come\s+)?(?:fatt[oaie]|finit[oaie]|completat[oaie])\s+(.+)/i)) ||
      (m = lower.match(/^(?:segna|marca|spunta)\s+(.+?)\s+(?:come\s+)?(?:fatt[oaie]|finit[oaie]|completat[oaie])\b/i))) {
    return { kind: "complete_task", query: stripArticles(m[1]) };
  }

  // ─── TASK: DELETE ────────────────────────────────────────
  // Careful: "cancella lista X" already handled above
  if ((m = lower.match(/^(?:cancella(?:mi)?|elimina(?:mi)?|rimuovi|togli|toglimi|leva(?:mi)?|levami|butta(?:\s+via)?)\s+(?:(?:il|la|lo|i|le|gli|l')\s*)?(?:task\s+|promemoria\s+|impegno\s+)?(?:(?:del|della|dello|di)\s+)?(.+)/i))) {
    const q = stripArticles(m[1]);
    if (!findTaskFuzzy(q, { includeDone: true })) {
      const hit = findListItemFuzzy(q, { onlyOpen: false });
      if (hit) return { kind: "list_remove", items: [hit.item.text], item: hit.item.text, listName: hit.list.name };
      const lst = Lists.findByName(q);
      if (lst && lst.name.toLowerCase() === q.toLowerCase()) return { kind: "list_delete", name: lst.name };
    }
    return { kind: "delete_task", query: q };
  }
  if ((m = lower.match(/^non\s+(?:voglio|mi\s+serve)\s+(?:più|pi[uù])\s+(.+)/i))) {
    return { kind: "delete_task", query: stripArticles(m[1]) };
  }

  // ─── SUMMARY / AGENDA ────────────────────────────────────
  if ((m = lower.match(/^(.+?)\s+(?:cosa|che\s+cosa|che)\s+(?:ho|abbiamo|c'?\s*è|devo\s+fare|ho\s+da\s+fare|faccio|ho\s+in\s+programma)\s*[?!.]*$/i))) {
    const w0 = m[1].trim();
    if (/^(?:oggi|stasera|stamattina|domani|questa\s+settimana)$/.test(w0)) return { kind: "summary", when: w0 };
    if (/^(?:nel\s+|questo\s+)?(?:weekend|fine\s*settimana)$/.test(w0)) return { kind: "summary", when: "weekend" };
    const w = parseWhenOnly(w0);
    if (w && w.dayKey) return { kind: "summary", when: "giorno", dayKey: w.dayKey };
  }
  if (/^(?:com'?\s*è|come\s+(?:è|sarà|va))\s+(?:la\s+)?(?:mia\s+|questa\s+)?settimana\b/i.test(lower)) return { kind: "summary", when: "questa settimana" };
  // Giorno qualsiasi: "cosa ho sabato", "che impegni ho il 3 ottobre", "sono libero venerdì sera?", "cosa c'è nel weekend"
  if ((m = lower.match(/^(?:(?:cosa|che\s+cosa|che|cos')\s+(?:ho|abbiamo|c'?\s*è|devo\s+fare|ho\s+da\s+fare|ho\s+in\s+programma|c'?\s*è\s+in\s+programma|faccio)|(?:che|quali)\s+(?:impegni|programmi|piani|appuntamenti|cose|eventi|task)\s+(?:ho|abbiamo|ci\s+sono|c'?\s*è)|(?:impegni|agenda|programma|appuntamenti)\s+(?:di|per|del|della)|sono\s+liber[oaie]|ho\s+(?:qualcosa|impegni|da\s+fare)|c'?\s*è\s+qualcosa)\s+(.+?)\s*[?!.]*$/i))) {
    const rest = m[1].trim().replace(/^(?:in\s+programma|in\s+agenda|da\s+fare|di\s+bello|in\s+calendario)\s+/i, "");
    if (/^(?:(?:nel|questo|il|per\s+il|a)\s+)?(?:weekend|week\s*end|fine\s*settimana)$/i.test(rest)) return { kind: "summary", when: "weekend" };
    if (!/^(?:oggi|stasera|stamattina|domani|questa\s+settimana|in\s+settimana|settimana|da\s+fare|in\s+programma|in\s+agenda|fare)$/i.test(rest)) {
      const w = parseWhenOnly(rest);
      if (w && w.dayKey) return { kind: "summary", when: "giorno", dayKey: w.dayKey };
    }
  }
  if ((m = lower.match(/^(?:chi|cosa|che\s+cosa)\s+(?:devo|dovrei)\s+(?:chiamare|sentire|vedere|pagare|fare|comprare)\s+(oggi|stasera|domani|questa\s+settimana)\s*[?!.]*$/i)) && !/comprare/.test(m[0])) {
    return { kind: "summary", when: m[1] };
  }
  if (/^(?:che|quali)\s+(?:programmi|piani|impegni|appuntamenti)\s+(?:ho|abbiamo)\b/i.test(lower)) {
    const w = lower.match(/\b(oggi|stasera|domani|questa\s+settimana)\b/);
    return { kind: "summary", when: w ? w[1] : "oggi" };
  }
  if ((m = lower.match(/^(?:cosa|che\s+cosa|che)\s+(?:ho|abbiamo|c'?\s*è)\s+(oggi|stasera|domani|dopodomani|questa\s+settimana|in\s+settimana)\s*[?!.]*$/i)) ||
      (m = lower.match(/^(?:impegni|appuntamenti|programma|agenda)\s+(?:di\s+|per\s+)?(oggi|stasera|domani|questa\s+settimana)\s*[?!.]*$/i))) {
    const w = m[1].replace(/in\s+settimana/, "questa settimana");
    return { kind: "summary", when: w };
  }
  //  "cosa devo fare", "che ho da fare", "che impegni ho", "cosa c'è in agenda", "agenda", "riassunto"
  if (/^(?:cosa|che\s+cosa|che|cos')\s+(?:devo|dovrei|ho\s+da|ho\s+in|c'?è\s+da|c'?è|abbiamo|abbiam)\s+(?:fare|da\s+fare|in\s+programma|in\s+agenda|programma|agenda|oggi|domani)?/i.test(lower) ||
      /^(?:che|quali)\s+(?:impegni|cose|task|appuntament[oi])\s+(?:ho|abbiamo)/i.test(lower) ||
      /^(?:agenda|riassunto|programma|impegni|dimmi\s+(?:l'?)?agenda)(?:\s+(?:di|per)\s+(?:oggi|domani|stasera|questa\s+settimana)|\s+(?:oggi|domani))?\s*[?!.]*$/i.test(lower) ||
      /^(?:mostrami|dimmi|fammi\s+vedere|leggimi|elencami)\s+(?:cosa|che\s+cosa|quello\s+che)\s+(?:devo|ho\s+da)\s+fare\b/i.test(lower) ||
      /^dimmi\s+(?:cosa|che\s+cosa|che\s+)?(?:devo|ho\s+da)\s+fare/i.test(lower) ||
      /^leggi(?:mi)?\s+(?:l'?)?agenda/i.test(lower) ||
      /^(?:ho|c'?è|abbiamo)\s+(?:qualcosa|qualche\s+impegno|impegni)\s+(?:oggi|domani|per\s+oggi|per\s+domani)?/i.test(lower)) {
    const w = lower.match(/\b(oggi|stamattina|stasera|domani|questa\s+settimana|settimana)\b/);
    const when = w ? (w[1] === "settimana" ? "questa settimana" : w[1]) : "oggi";
    return { kind: "summary", when };
  }

  // ─── NAVIGATION: OPEN ────────────────────────────────────
  // "apri/mostra/vedi/vai a/voglio vedere calendario"
  const openMatch = lower.match(/^(?:apri(?:mi)?|mostra(?:mi)?|vedi|vedere|vai\s+(?:a|su)|voglio\s+vedere|fammi\s+vedere)\s+(?:il\s+|la\s+|le\s+|l'\s*)?(calendari[oi]|lista|liste|impostazion[ei]|note|agenda)\b/i);
  if (openMatch) {
    const tgt = openMatch[1];
    if (/calendari/i.test(tgt) || /agenda/i.test(tgt)) return { kind: "open", target: "calendar" };
    if (/list/i.test(tgt) || /note/i.test(tgt))        return { kind: "open", target: "lists" };
    if (/impostazion/i.test(tgt))                      return { kind: "open", target: "settings" };
  }
  if (/^(?:calendario|agenda)\s*$/i.test(lower))        return { kind: "open", target: "calendar" };
  if (/^(?:liste|le\s+mie\s+liste|note)\s*$/i.test(lower)) return { kind: "open", target: "lists" };
  if (/^impostazioni\s*$/i.test(lower))                 return { kind: "open", target: "settings" };

  // ─── NAVIGATION: CLOSE ───────────────────────────────────
  if (/^(?:chiudi|esci|torna\s+indietro|indietro|stop|ok\s+chiudi)(?:\s+(?:tutto|qui|il\s+calendario|il\s+pannello|le\s+liste|la\s+lista|l'agenda|le\s+impostazioni|l'aiuto|questa\s+schermata|da\s+qui))?\s*[?!.]*$/i.test(lower)) {
    return { kind: "close" };
  }

  // ─── QUESTIONS: TIME / DATE ──────────────────────────────
  if (/^(?:che\s+or[aey]|dimmi\s+l'?ora|che\s+ore?\s+(?:sono|è)|ora\s+è)\b/i.test(lower)) {
    return { kind: "time_info" };
  }
  if (/^(?:che\s+giorno|che\s+data|dimmi\s+la\s+data|dimmi\s+il\s+giorno|giorno\s+è|data\s+(?:di\s+)?oggi)\b/i.test(lower)) {
    return { kind: "date_info" };
  }

  // ─── "RICORDAMI DI X" / "DEVO X" / "NON DIMENTICARE X" → TASK ─
  // These are the most natural Italian forms for adding a task
  if ((m = t.match(/^(?:ricordami|ricordati|ricordamene|promemoria(?:\s+per)?|ricorda)\s+(.+)/i)) ||
      (m = t.match(/^(?:devo|dovrei|ho\s+da|bisogna|bisognerebbe|mi\s+tocca|tocca)\s+(.+)/i)) ||
      (m = t.match(/^non\s+(?:devo|posso)\s+dimenticar(?:e|mi)\s+(.+)/i)) ||
      (m = t.match(/^non\s+dimenticar(?:e|ti)\s+(.+)/i))) {
    return taskFromText(m[1], t);
  }

  // ─── CANCEL / STOP (mid-conversation, user wants to abort) ───
  // Must come before chat so "no fa nulla" isn't mistaken for a greeting
  if (/^(?:aspetta(?:\s+un\s+(?:po'?|attimo|secondo))?|lascia\s+(?:stare|perdere)|non\s+importa|niente|fa\s+niente|fa\s+nulla|no[,.\s]+(?:fa\s+)?(?:niente|nulla)|no[,.\s]+lascia\s+stare|scusa[,.\s]+niente|scusami[,.\s]+niente|ho\s+sbagliato|stavo\s+scherzando|nulla|zitt[ao])\b/i.test(lower) ||
      /^(?:basta|basta\s+così|ok\s+basta|lascia\s+così|va\s+bene\s+così)\s*[?!.]*$/i.test(lower) ||
      /^no\s*[,.!?]?\s*$/i.test(lower)) {
    return { kind: "cancel" };
  }

  // ─── CHAT / SOCIAL ────────────────────────────────────────
  // Matches ONLY when the phrase is mostly conversational (no embedded action).
  // If user says "ciao quanto fa 2+2", the "ciao" got stripped by normalize —
  // only pure greetings/questions-about-teto reach here.
  const wordCount = t.split(/\s+/).length;
  if (wordCount <= 6) {
    if (/^(?:ciao|salve|ehi|hey|hola|yo|buondì)\s*[,!.?]*\s*(?:teto)?\s*$/i.test(lower) ||
        /^(?:buon(?:giorno|asera|anotte|a\s+sera|a\s+notte|\s+pomeriggio)|buona\s+(?:giornata|serata|notte))\s*[,!.?]*\s*(?:teto)?\s*$/i.test(lower) ||
        /^(?:come\s+(?:stai|va|ti\s+senti|butta)|tutto\s+(?:bene|ok|a\s+posto)|va\s+tutto\s+bene|come\s+va\s+la\s+vita|che\s+fai|cosa\s+fai|che\s+si\s+fa)\s*[?!.]*\s*$/i.test(lower) ||
        /^(?:grazie(?:\s+mille|\s+tante|\s+davvero)?|ti\s+ringrazio|mille\s+grazie|grazie\s+a\s+te)\s*[?!.]*\s*$/i.test(lower) ||
        /^(?:chi\s+sei|cosa\s+sei|come\s+ti\s+chiami|presentati|parlami\s+di\s+te|sei\s+teto|tu\s+chi\s+sei)\s*[?!.]*\s*$/i.test(lower) ||
        /^(?:ti\s+(?:voglio\s+bene|amo|adoro)|sei\s+(?:brava|fantastica|bellissima|carina|la\s+migliore|forte|dolce|simpatica))\s*[?!.]*\s*$/i.test(lower) ||
        /^(?:hai\s+(?:fame|sete|sonno|freddo|caldo|paura)|sei\s+(?:stanca|triste|felice|contenta|annoiata|sveglia|viva|reale))\s*[?!.]*\s*$/i.test(lower) ||
        /^(?:ti\s+piace|ti\s+piacciono|cosa\s+(?:pensi|ne\s+pensi)|che\s+(?:pensi|ne\s+pensi)|ci\s+sei|sei\s+(?:lì|qua|qui))\b/i.test(lower) ||
        /^(?:mi\s+(?:senti|ascolti)|puoi\s+sentirmi|mi\s+ricordi|ricordi\s+(?:chi\s+sei|di\s+me))\s*[?!.]*\s*$/i.test(lower) ||
        /^(?:ehi\s+teto|ehy\s+teto|hey\s+teto|teto)\s*[?!.]*\s*$/i.test(lower)) {
      return { kind: "chat", text: t };
    }
  }

  // ─── QUESTIONS WE CAN ANSWER ─────────────────────────────
  // WEATHER
  if (t.split(/\s+/).length <= 6 && /(?:^|\s)(?:piove|pioverà|piovera|nevica|nevicherà|ombrello|meteo)(?=[\s?!.,]|$)/i.test(lower) && !/^(?:ricordami|devo|comprare|compra|prendere)\b/i.test(lower)) {
    const cm = lower.match(/\b(?:a|in)\s+([a-zàèéìòù' ]{3,30})$/i);
    return { kind: "weather", city: cm && !/^(?:oggi|domani)$/.test(cm[1]) ? cm[1].trim() : null, when: /\bdomani\b/.test(lower) ? "tomorrow" : "now" };
  }
  if (/^(?:piover[àa]|pioverebbe|nevicher[àa]|nevica|far[àa]\s+(?:caldo|freddo|bel\s+tempo|brutto)|(?:mi\s+)?serve\s+l'?\s*ombrello|devo\s+prendere\s+l'?\s*ombrello|prendo\s+l'?\s*ombrello|quanti\s+gradi|che\s+temperatura|temperatura)(?=[\s?!.,]|$)/i.test(lower)) {
    const cm = lower.match(/\b(?:a|in)\s+([a-zàèéìòù' ]{3,30})$/i);
    return { kind: "weather", city: cm && !/^(?:oggi|domani)$/.test(cm[1]) ? cm[1].trim() : null, when: /\bdomani\b/.test(lower) ? "tomorrow" : "now" };
  }
  if ((m = lower.match(/^(?:che\s+tempo\s+(?:fa|farà|fara|ci\s+sarà)|com'?\s*è\s+il\s+tempo|come\s+sarà\s+il\s+tempo|meteo)\s+(oggi|domani|stasera)(?:\s+(?:a|in|su)\s+(.+))?\s*[?!.]*$/i))) {
    return { kind: "weather", city: m[2] ? m[2].trim() : null, when: m[1] === "domani" ? "tomorrow" : "now" };
  }
  if ((m = lower.match(/^(?:che\s+tempo\s+fa|com'?è\s+il\s+tempo|come\s+è\s+il\s+tempo|che\s+tempo\s+c'?è|piove|sta\s+piovendo|fa\s+caldo|fa\s+freddo|c'?è\s+il\s+sole|meteo)(?:\s+(?:a|in|su)\s+(.+))?$/i))) {
    return { kind: "weather", city: m[1] ? m[1].trim() : null, when: "now" };
  }
  if ((m = lower.match(/^(?:che\s+tempo\s+(?:farà|fara)|come\s+sarà\s+il\s+tempo|meteo)\s+domani(?:\s+(?:a|in|su)\s+(.+))?$/i))) {
    return { kind: "weather", city: m[1] ? m[1].trim() : null, when: "tomorrow" };
  }
  if (/^meteo\s+domani$/i.test(lower)) {
    return { kind: "weather", city: null, when: "tomorrow" };
  }

  // MATH — "quanto fa X" / "calcola X" / "quanto è X" / "fai X+Y" / "risolvi X"
  if ((m = lower.match(/^(?:quanto\s+(?:fa|è|sono|vale|viene|fanno)|calcola(?:mi|temi)?|fammi\s+il\s+conto\s+di|fai(?:mi)?(?!\s+partire)|risolvi(?:mi)?|qual\s+è\s+il\s+risultato\s+di|il\s+risultato\s+di|risultato\s+di|somma\s+(?:di|tra|fra)|prodotto\s+(?:di|tra|fra)|differenza\s+(?:di|tra|fra)|fa)\s+(.+)/i))) {
    const result = computeMath(m[1]);
    if (result !== null) return { kind: "math", expr: m[1].trim(), result };
    if (/\d/.test(m[1]) && /^(?:quanto|calcola|risolvi)/i.test(lower)) return { kind: "unknown_question", topic: "math" };
    // niente numeri → non è un calcolo: prosegue (es. "fai la spesa" = task)
  }
  if (/^\d+(?:[.,]\d+)?\s+(?:più|piu|meno|per|diviso|fratto|x|volte)\s+\d/i.test(lower)) {
    const result = computeMath(t);
    if (result !== null) return { kind: "math", expr: t, result };
  }
  // Standalone math: "15 * 3" / "2+2" / "radice di 16" / "3 al quadrato" / "20% di 150"
  if (/^[\d\s+\-*/().,%]+$/.test(t) && /[+\-*/%]/.test(t) && /\d/.test(t)) {
    const result = computeMath(t);
    if (result !== null) return { kind: "math", expr: t, result };
  }
  if (/\bradice\s+(?:quadrata\s+)?di\b|\bal\s+quadrato\b|\bal\s+cubo\b|^\d+(?:[.,]\d+)?\s+elevato\b|\bpercento\s+di\b|\b\d+%\s*di\b/i.test(lower)) {
    const result = computeMath(t);
    if (result !== null) return { kind: "math", expr: t, result };
  }

  // SVEGLIA — "metti una sveglia tra 10 minuti" → timer / "sveglia alle 7" → promemoria
  if ((m = lower.match(/^(?:metti(?:mi)?|imposta(?:mi)?|punta(?:mi)?|programma)?\s*(?:una\s+|la\s+)?sveglia\s+(.+)$/i))) {
    const ms = /^(?:tra|fra|di|per)\s/.test(m[1]) ? parseDuration(m[1]) : null;
    if (ms && ms > 0 && ms < 24 * 3600 * 1000) return { kind: "timer", ms, label: formatDuration(ms) };
    const dt = parseDateTime(m[1]);
    if (dt) {
      let ts = dt.timestamp;
      const hm = m[1].match(/\b(?:alle|ore)\s+(\d{1,2})\b/i);
      // Una sveglia "alle 7" è di mattina, salvo "di sera/pomeriggio"
      if (hm && +hm[1] < 12 && !/sera|pomeriggio|notte/i.test(m[1])) {
        const d = new Date(ts);
        if (d.getHours() >= 12) { d.setHours(d.getHours() - 12); if (d.getTime() <= Date.now()) d.setDate(d.getDate() + 1); ts = d.getTime(); }
      }
      return { kind: "task", text: "⏰ Sveglia" + (dt.cleaned ? " — " + dt.cleaned : ""), reminderAt: ts, repeat: dt.repeat || null };
    }
  }
  // TIMER — "metti un timer di 5 minuti"
  if ((m = lower.match(/^(?:metti(?:mi)?|imposta(?:mi)?|avvia(?:mi)?|parti\s+con|fai\s+partire|fammi)?\s*(?:un\s+|il\s+|lo\s+)?timer\s+(?:di\s+|da\s+|per\s+|a\s+)?(.+)/i)) ||
      (m = lower.match(/^timer\s+(.+)/i))) {
    const ms = parseDuration(m[1]);
    if (ms && ms > 0 && ms < 24*3600*1000) {
      // Nome del timer: quello che resta togliendo la durata ("per la pasta 8 minuti" → "pasta")
      const name = m[1].toLowerCase()
        .replace(/\b(?:\d+(?:[.,]\d+)?|un|una|uno|mezz'?\s*ora|un\s+quarto\s+d'?\s*ora|quarto|d'?ora|minut[oi]|min|second[oi]|sec|or[ae]|h|e\s+mezz[ao])\b/g, " ")
        .replace(/\b(?:uno|due|tre|quattro|cinque|sei|sette|otto|nove|dieci|undici|dodici|quindici|venti|trenta|quaranta|quarantacinque|cinquanta|sessanta)\b/g, " ")
        .replace(/^(?:\s*(?:per|di|da|a|la|il|lo|le|i|gli|del|della|dello)\b)+/g, " ").replace(/\s+/g, " ").trim()
        .replace(/^(?:per|di|da|la|il|lo)\s+|\s+(?:per|di|da|e)$/g, "").trim();
      const nice = name && name.length >= 3 && name.length <= 30 && !/^(?:e|di|per)$/.test(name);
      return { kind: "timer", ms, label: nice ? `${name} (${formatDuration(ms)})` : formatDuration(ms) };
    }
    return { kind: "clarify", original: "timer: durata non chiara (es. \"timer di 5 minuti\")" };
  }

  // COIN / DICE / RANDOM
  if (/^testa\s+o\s+croce\b/i.test(lower) ||
      /^(?:lancia(?:mi)?|tira(?:mi)?)\s+(?:una\s+)?moneta\b/i.test(lower)) {
    return { kind: "coin" };
  }
  if (/^(?:tira(?:mi)?|lancia(?:mi)?)\s+(?:un\s+)?dado\b/i.test(lower) || /^dado\s*$/i.test(lower)) {
    return { kind: "dice" };
  }
  if ((m = lower.match(/^(?:numero\s+casuale|dammi\s+un\s+numero|un\s+numero\s+(?:a\s+caso|casuale))(?:\s+(?:tra|fra|da)\s+(\d+)\s+(?:e|a)\s+(\d+))?/i))) {
    const min = m[1] ? parseInt(m[1]) : 1;
    const max = m[2] ? parseInt(m[2]) : 100;
    return { kind: "random", min: Math.min(min,max), max: Math.max(min,max) };
  }

  // UNIT CONVERSION — "convertimi 5 km in metri" / "5 km in metri"
  if ((m = lower.match(/^(?:converti(?:mi)?|trasforma|cambia|quanti\s+fanno)\s+(\d+(?:[,.]\d+)?)\s+(\S+)\s+in\s+(\S+)/i)) ||
      (m = lower.match(/^(\d+(?:[,.]\d+)?)\s+(\S+)\s+in\s+(\S+)\s*$/i))) {
    const value = parseFloat(m[1].replace(",","."));
    return { kind: "convert", value, from: m[2], to: m[3] };
  }

  // COUNTDOWN — "quanti giorni a/al/mancano a X" / "quando è X"
  if ((m = lower.match(/^(?:quant[ie]\s+giorni?\s+(?:mancano\s+|manca\s+|ci\s+sono\s+|c'?è\s+)?|quanto\s+manca(?:no)?\s+|manca\s+molto\s+)(?:(?:alla|allo|alle|agli|al|ai|a|per)\s+|all')(.+?)[?!.]*$/i))) {
    const q = stripArticles(m[1].trim());
    if (!findHoliday(q) && Calendar.findByTitle(q)) return { kind: "event_query", query: q };
    return { kind: "countdown", holiday: q };
  }

  // QUOTES — "dimmi qualcosa/una frase/una citazione/stupiscimi"
  if (/^(?:dimmi\s+(?:qualcosa|una\s+cosa|una\s+frase|una\s+citazione|qualcosa\s+di\s+bello)|(?:una\s+)?frase\s+(?:di\s+)?teto|(?:una\s+)?citazione|stupiscimi|fammi\s+sorridere|dimmi\s+(?:la\s+)?tua\s+(?:frase|citazione))\b/i.test(lower)) {
    return { kind: "quote" };
  }
  if (/^(?:racconta(?:mi)?|dimmi)\s+(?:una\s+)?(?:barzelletta|battuta|storia|battutona)/i.test(lower) ||
      /^fammi\s+ridere\b/i.test(lower)) {
    return { kind: "joke" };
  }

  // QUESTIONS WE STILL CAN'T ANSWER
  if (/^(?:googla|google)\b|^(?:cerca|trova)\s+(?:su\s+(?:internet|google|web)|online|in\s+rete|sul\s+web)\b|\b(?:su\s+google|su\s+internet)\s*[?!.]*$/i.test(lower) && !/^(?:devo|ricordami)/i.test(lower)) {
    return { kind: "unknown_question", topic: "search" };
  }

  // ─── VERBI DI CREAZIONE: "metti/segna/inserisci/fissa X sabato alle 17" ──
  // Il verbo non fa parte del nome: lo tolgo e rianalizzo; "in calendario/evento" → evento, "promemoria/task" → task
  {
    const cv = t.match(/^(?:metti(?:mi|ci)?(?!\s+(?:a\s+posto|apposto|in\s+ordine|via|da\s+parte|in\s+carica|in\s+frigo|su\b|giù|a\s+\S+re\b|in\s+lavatrice|a\s+lavare|in\s+forno))|mettere|segna(?:mi|ti|re)?|inserisci(?:mi)?|aggiungi(?:mi)?|fissa(?:mi|re)?|pianifica(?:mi)?|crea(?:mi)?|annota(?:mi)?|registra(?:mi)?|scrivi(?:mi)?(?=\s+(?:di|che)\s)|nuov[oa])\s+(?:(?:in|nel|nella|sul|sulla|sull')\s*(?:calendario|agenda)\s+)?(?:(?:un|una|un'|il|la|lo|l')\s*)?(?:(evento|appuntamento|impegno|promemoria|task|cosa\s+da\s+fare|compito|attività)\s+(?!con\s))?(?:(?:in|nel|nella|sul|sulla)\s+(?:calendario|agenda)\s+)?(?:(?:per|di|che|:)\s+)?/i);
    if (cv && cv[0].trim() && t.length > cv[0].length + 1) {
      const rest = t.slice(cv[0].length).trim();
      const force = /calendario|agenda|evento|appuntamento|impegno/i.test(cv[0]) ? "event" : /promemoria|task|cosa\s+da\s+fare|compito/i.test(cv[0]) ? "task" : null;

    const it = pc.items[0];

/* ─── Intent quality + command pipeline ─── */
function estimateIntentConfidence(intent, normalizedText) {
  if (!intent || !intent.kind) return 0.2;
  const txt = String(normalizedText || "").trim();
  if (!txt) return 0.2;

  const baseByKind = {
    undo: 0.98, help: 0.97,
    event_delete: 0.9, event_move: 0.88, event_query: 0.9,
    list_create: 0.9, list_add: 0.9, list_read: 0.9, list_check: 0.87, list_edit: 0.87, list_clear: 0.9, list_count: 0.9, list_share: 0.87,
    weather: 0.86, timer: 0.92, math: 0.9, convert: 0.9, holiday_when: 0.88,
    focus_enter: 0.9, focus_exit: 0.9, briefing: 0.88, plan_day: 0.88,
    task: 0.82, event: 0.78, chat: 0.6, fallback: 0.45,
  };
  let score = baseByKind[intent.kind] ?? 0.75;

  if (intent.kind === "task") {
    const taskText = String(intent.text || "").trim();
    if (!taskText) score -= 0.45;
    else if (taskText.length < 3) score -= 0.2;
    else if (taskText.length < 6) score -= 0.08;
  }
  if (intent.kind === "event") {
    if (!intent.title || String(intent.title).trim().length < 3) score -= 0.25;
    if (!intent.timestamp) score -= 0.15;
  }
  if (intent.kind === "chat" && txt.length < 2) score -= 0.2;

  if (/\b(ricordami|crea|aggiungi|sposta|cancella|timer|meteo|lista|evento)\b/i.test(txt)) score += 0.05;
  if (/\b(domani|oggi|stasera|alle\s+\d{1,2}|tra|fra)\b/i.test(txt)) score += 0.03;

  return Math.max(0.2, Math.min(0.99, Number(score.toFixed(2))));
}

function needsClarification(intent, normalizedText) {
  if (!intent) return "Non ho capito bene. Puoi ripetere?";
  const txt = String(normalizedText || "").trim();

  if (intent.kind === "fallback" || txt.length <= 1) {
    return "Non ho capito bene. Prova con: \"ricordami di...\" oppure \"crea lista...\"";
  }
  if (intent.kind === "task") {
    const taskText = String(intent.text || "").trim();
    if (!taskText || /^(di|da|a|per|il|la|un|una)$/i.test(taskText)) {
      return "Certo! Che cosa devo aggiungere esattamente?";
    }
  }
  if (intent.kind === "event" && (!intent.title || String(intent.title).trim().length < 3)) {
    return "Va bene, che titolo vuoi dare all'evento?";
  }
  return null;
}

function recordIntentStats(meta, wasClarification, wasFallback) {
  state.intentStats.total += 1;
  if (wasClarification) state.intentStats.clarified += 1;
  if (wasFallback) state.intentStats.fallback += 1;
  const k = meta.kind || "unknown";
  state.intentStats.byKind[k] = (state.intentStats.byKind[k] || 0) + 1;
  const n = state.intentStats.total;
  const prev = state.intentStats.avgLatencyMs || 0;
  state.intentStats.avgLatencyMs = Math.round(((prev * (n - 1)) + meta.latencyMs) / n);
}

async function processUserCommand(rawText, source = "text") {
  const startedAt = performance.now();
  const original = String(rawText || "").trim();
  if (!original) return { ok: true, empty: true };
  state.lastUtterance = original;
  // 1) Pending destructive confirmation (yes/no).
  if (state.pendingDangerAction) {
    if (isAffirmative(original)) {
      const pending = state.pendingDangerAction;
      state.pendingDangerAction = null;
      const intent = { kind: pending.kind, ...(pending.payload || {}) };
      const reply = await executeIntent(intent);
      if (reply) showBubble(formatAssistantReply(reply));
      return { ok: true, confirmed: true, intent, reply };
    }
    if (isNegative(original)) {
      state.pendingDangerAction = null;
      showBubble("Perfetto, annullato.");
      return { ok: true, cancelled: true };
    }
    // Né sì né no: l'utente è passato ad altro → lascio perdere la conferma
    // e processo normalmente il nuovo comando (prima restava bloccato per sempre).
    state.pendingDangerAction = null;
  }
  // 1b) Risposta a "Quale sposto?" / "A quando lo sposto?"
  if (state.pendingChoice) {
    const pc = state.pendingChoice;
    state.pendingChoice = null;
    const r = await resolvePendingChoice(pc, original);
    if (r) { showBubble(formatAssistantReply(r)); return { ok: true, fromChoice: true, reply: r }; }
  }

  // Route through Gemini if enabled (dopo la gestione delle conferme sì/no).
  // Comandi chiari e strutturati li esegue subito il parser locale: più veloce,
  // funziona offline e non consuma chiamate. Gemini resta per il linguaggio libero.
  if (GeminiAgent.enabled && (window.tetoAI || GeminiAgent.apiKey) && !state.pendingClarification) {
    let local = null;
    try { if (splitCompositeCommands(original).length === 1) local = detectIntent(original); } catch(e) {}
    const FAST = new Set(["list_add","list_check","list_remove","list_create","list_read","list_clear","list_count","list_edit",
      "task_followup","timer_cancel","timer_status","overdue_list","bulk_reschedule","next_up","place_set","place_get","task_note","task_rename","task_category",
      "delete_done","complete_all","tts_set","theme_set","filter_set","repeat_last","delete_task","list_delete",
      "timer","math","convert","time_info","date_info","open","close","undo","help","event","event_move",
      "event_delete","event_query","agenda_clear_day","complete_task","summary","weather","coin","dice","random","countdown","focus_enter","focus_exit"]);
    const shortTask = local && local.kind === "task" && String(local.text || "").split(/\s+/).length <= 8;
    const fast = local && (FAST.has(local.kind) || shortTask) && !(local.kind === "event" && !local.timestamp);
    if (!fast) {
      const ok = await GeminiAgent.run(original);
      if (ok) return { ok: true, source: "gemini" };
      // Gemini fallisce → continua con il parser locale
    }
  }

  // 2) Pending clarification slot filling.
  if (state.pendingClarification && !isNegative(original)) {
    const c = state.pendingClarification;
    state.pendingClarification = null;
    if (c.slot === "task_text") {
      const dt = parseDateTime(original);
      const intent = { kind: "task", text: (dt?.cleaned || original).trim(), reminderAt: dt?.timestamp || null };
      const reply = await executeIntent(intent);
      if (reply) showBubble(formatAssistantReply(reply));
      return { ok: true, fromClarification: true, intent, reply };
    }
    if (c.slot === "event_title") {
      const dt = parseDateTime(original);
      const intent = { kind: "event", title: (dt?.cleaned || original).trim(), timestamp: dt?.timestamp || null };
      const reply = await executeIntent(intent);
      if (reply) showBubble(formatAssistantReply(reply));
      return { ok: true, fromClarification: true, intent, reply };
    }
  }

  // 3) Composite commands: "X e poi Y".
  const parts = splitCompositeCommands(original);
  if (parts.length > 1) {
    let done = 0;
    for (const p of parts) {
      const r = await processUserCommand(p, source);
      if (r?.ok) done++;
    }
    if (done > 1) showBubble(`Fatto: ho eseguito ${done} azioni.`);
    return { ok: true, composite: true, done };
  }

  // 4) Immediate visual ack for perceived speed.
  showBubble("Capito, ci penso io...", { silent: true });

  const normalized = normalizeVoiceInput(original);
  const intent = detectIntent(original);
  const confidence = estimateIntentConfidence(intent, normalized);
  const clarification = needsClarification(intent, normalized);
  const meta = { kind: intent?.kind || "unknown", confidence, source, latencyMs: 0, at: Date.now() };

  // Keep slot open when we need a focused follow-up.
  if (clarification && confidence < 0.7) {
    if (intent?.kind === "clarify" || intent?.kind === "task") {
      state.pendingClarification = { slot: "task_text", hint: original };
    }
    meta.latencyMs = Math.round(performance.now() - startedAt);
    state.lastIntentMeta = meta;
    recordIntentStats(meta, true, intent?.kind === "fallback");
    showBubble(clarification);
    return { ok: true, clarified: true, intent, meta };
  }

  const reply = await executeIntent(intent);
  meta.latencyMs = Math.round(performance.now() - startedAt);
  state.lastIntentMeta = meta;
  recordIntentStats(meta, false, intent?.kind === "fallback");
  if (reply) {
    if (intent?.kind === "repeat_last") showBubble(reply);
    else { state.lastReply = formatAssistantReply(reply); showBubble(state.lastReply); }
  }
  return { ok: true, clarified: false, intent, meta, reply };
}

async function executeIntent(intent) {
  switch (intent.kind) {
    case "response_style": {
      state.responseStyle = intent.style || "normal";
      localStorage.setItem("teto-response-style", state.responseStyle);
      if (state.responseStyle === "short") return "Ok, da ora rispondo più breve.";
      if (state.responseStyle === "detailed") return "Perfetto, risposte più dettagliate attivate.";
      return "Va bene, torno a risposte standard.";
    }
    case "alias_set": {
      const canonical = normalizeListRef(intent.canonical);
      if (!canonical) return "Dimmi il nome della lista da usare come riferimento.";
      saveAlias(intent.alias, canonical);
      return `Perfetto: da ora "${intent.alias}" significa lista "${canonical}"`;
    }
    case "alias_remove": {
      const key = String(intent.alias || "").toLowerCase().trim();
      if (!key || !state.commandAliases[key]) return `Non trovo l'alias "${intent.alias}"`;

    }

    }
    case "task": {

        note: "", done: false, ts: Date.now(),

      };
